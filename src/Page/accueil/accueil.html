<!-- ================= PAGE mobile ================= -->
<div [ngStyle]="{'background':themeService.Background1}"
  class="actus-container min-h-screen transition-colors duration-500 relative">


  <!-- Contenu principal (TOUJOURS AU-DESSUS) -->
  <div class="relative z-[10] min-h-screen">
    <app-header></app-header>
    <app-welcome></app-welcome>
    <app-bot></app-bot>
    <app-widget-scan></app-widget-scan>
    <app-ma-collection></app-ma-collection>
    <app-footer></app-footer>

    <!--<app-bot-assistant></app-bot-assistant> -->
  </div>

</div>

<style>
  /* Animation subtile pour la grille */
  @keyframes gridPulse {

    0%,
    100% {
      opacity: 0.05;
    }

    50% {
      opacity: 0.12;
    }
  }

  html {
    scroll-behavior: smooth;
  }

  /* Assure que le conteneur prend bien toute la hauteur */
  .actus-container {
    display: flex;
    flex-direction: column;
  }
</style>
