<!-- ================= PAGE mobile ================= -->
<div [ngStyle]="{'background':themeService.Background1}"
  class="actus-container min-h-screen transition-colors duration-500 relative">


  <!-- Contenu principal (TOUJOURS AU-DESSUS) -->
  <div class="relative z-[10] min-h-screen">
    <app-header-bienvenue></app-header-bienvenue>
    <app-welcome-bienvenue></app-welcome-bienvenue>
    <app-statistiques></app-statistiques>
    <app-pourquoi></app-pourquoi>
    <app-role></app-role>
    <app-ticket-welcome></app-ticket-welcome>
    <app-footer-bienvenue></app-footer-bienvenue>
  </div>

</div>

<style>
  /* Animation subtile pour la grille */
  @keyframes gridPulse {

    0%,
    100% {
      opacity: 0.05;
    }

    50% {
      opacity: 0.12;
    }
  }

  html {
    scroll-behavior: smooth;
  }

  /* Assure que le conteneur prend bien toute la hauteur */
  .actus-container {
    display: flex;
    flex-direction: column;
  }
</style>
