<!-- ============================================================
     PAGE RESPONSIVE — ARBORIA
     Angular standalone + Tailwind CSS

     • Chaque élément occupe toute la largeur disponible
     • Aucun espace extérieur à gauche et à droite
     • Aucun padding horizontal ajouté au conteneur principal
     • Page principale à partir de 325px
     • Écran alternatif sous 325px
     • Défilement vertical naturel conservé
     • Scrollbar masquée visuellement par le CSS existant
     • Responsive mobile, tablette et desktop
============================================================ -->

<!-- ============================================================
     PAGE PRINCIPALE : LARGEUR >= 325PX
============================================================ -->

<ng-container *ngIf="largeurCompatible; else pageNonCompatible">

    <main class="actus-container relative flex min-h-screen min-h-[100dvh]
             w-full min-w-0 flex-col
             overflow-x-clip
             p-0 m-0
             transition-colors duration-500" [ngStyle]="{
        'background': themeService.BG1
      }">
  
      <!-- CONTENU PRINCIPAL : PLEINE LARGEUR -->
      <div class="relative z-10 flex w-full min-w-0 flex-1
               flex-col m-0 p-0">
  
        <!-- ======================================================
             EN-TÊTE
        ======================================================= -->
  
        <app-header-bienvenue class="block w-full min-w-0 m-0 p-0"></app-header-bienvenue>
  
        <!-- ======================================================
             SECTION BIENVENUE
        ======================================================= -->
  
        <section class="relative m-0 block w-full min-w-0 p-0">
          <app-hero-search class="m-0 block w-full min-w-0 p-0"></app-hero-search>
        </section>
  
        <!-- ======================================================
        ESPACEMENT ENTRE LES COMPOSANTS — 30 PX
        ======================================================= -->
  
        <div aria-hidden="true" class="block h-[50px] w-full shrink-0"></div>
  
        <!-- ======================================================
        SECTION POURQUOI ARBORIA
        ======================================================= -->
  
        <section class="relative m-0 block w-full min-w-0 p-0">
          <app-comment-recherche class="relative m-0 block w-full min-w-0 p-0"></app-comment-recherche>
        </section>
  
  
        <!-- ======================================================
        ESPACEMENT ENTRE LES COMPOSANTS — 30 PX
        ======================================================= -->
  
        <div aria-hidden="true" class="block h-[50px] w-full shrink-0"></div>
  
        <!-- ======================================================
             FONCTIONNALITÉS
        ======================================================= -->
  
        <section class="relative block w-full min-w-0 m-0 p-0">
          <app-explore-catalogue class="block w-full min-w-0 m-0 p-0"></app-explore-catalogue>
        </section>
  
  
        <!-- ======================================================
        ESPACEMENT ENTRE LES COMPOSANTS — 30 PX
        ======================================================= -->
  
        <div aria-hidden="true" class="block h-[50px] w-full shrink-0"></div>
  
  
        <!-- ======================================================
        RÔLE 
        ======================================================= -->
  
  
        <section class="relative block w-full min-w-0 m-0 p-0">
  
          <app-recherche-besoins class="relative block w-full min-w-0 m-0 p-0"></app-recherche-besoins>
  
        </section>
  
  
        <!-- ======================================================
        ESPACEMENT ENTRE LES COMPOSANTS — 30 PX
        ======================================================= -->
  
        <div aria-hidden="true" class="block h-[50px] w-full shrink-0"></div>


        <!-- ======================================================
        pourquoi 
        ======================================================= -->
  
  
        <section class="relative block w-full min-w-0 m-0 p-0">
  
          <app-pourquoi-recherche></app-pourquoi-recherche>
  
        </section>
  
  
       
        <!-- ======================================================
             PIED DE PAGE
        ======================================================= -->
  
        
        <footer class="relative block w-full min-w-0 m-0 p-0">
          <app-footer-bienvenue
            class="block w-full min-w-0 m-0 p-0"
          ></app-footer-bienvenue>
        </footer>
       
  
      </div>
  
    </main>
  
  </ng-container>
  
  <!-- ============================================================
       PAGE ALTERNATIVE : LARGEUR < 325PX
  ============================================================ -->
  
  <ng-template #pageNonCompatible>
  
    <main class="actus-container relative flex min-h-screen min-h-[100dvh]
             w-full min-w-0 flex-col
             overflow-x-clip
             m-0 p-0
             transition-colors duration-500" [ngStyle]="{
        'background': themeService.isDarkMode ? '#1F2925' : '#FFFFFF'
      }">
  
      <app-no-compatible class="block w-full min-w-0 m-0 p-0"></app-no-compatible>
  
    </main>
  
  </ng-template>
