<!-- <!-- ============================================================
     🌿 JARDISCAN — WELCOME / LANDING PAGE
     
     • Page publique avant connexion
     • Angular 20 Standalone
     • Tailwind CSS
     • ThemeService conservé
     • Responsive Mobile / Tablet / Desktop
     • UI/UX premium
     • Sections supplémentaires
     • Images intégrées
     • Modal ticket fonctionnelle
     ============================================================ --

     <div
     class="min-h-screen overflow-x-hidden"
     [ngStyle]="{
       background: themeService.Background1,
       color: themeService.TextPrincipal
     }"
   >
   
     <!-- ============================================================
          HEADER
          ============================================================ --
   
     <header
       class="
         sticky top-0 z-50
         border-b backdrop-blur-2xl
       "
       [ngStyle]="{
         background: themeService.GlassBackground,
         borderColor: themeService.Border1
       }"
     >
   
       <div
         class="
           mx-auto flex min-h-[74px] w-full
           items-center justify-between gap-4
           px-4 sm:px-6 lg:px-10 xl:px-14
         "
       >
   
         <!-- LOGO --
   
         <a
           href="#welcome"
           aria-label="Retour à l'accueil JardiScan"
           class="group flex shrink-0 items-center gap-3"
         >
   
           <div
             class="
               relative flex h-11 w-11
               items-center justify-center
               overflow-hidden rounded-2xl
               shadow-lg transition duration-300
               group-hover:scale-105
             "
             [ngStyle]="{
               background: themeService.Primary,
               boxShadow: themeService.BoxShadowPrimary
             }"
           >
             <span class="text-xl">🌿</span>
   
             <span
               class="
                 absolute inset-0
                 -translate-x-full
                 bg-white/20
                 transition duration-500
                 group-hover:translate-x-0
               "
             ></span>
           </div>
   
           <div class="hidden sm:block">
   
             <p
               class="text-lg font-black tracking-tight"
               [ngStyle]="{
                 color: themeService.TextPrincipal
               }"
             >
               JardiScan
             </p>
   
             <p
               class="text-[11px] font-medium"
               [ngStyle]="{
                 color: themeService.TextMuted
               }"
             >
               Explorez • Identifiez • Apprenez
             </p>
   
           </div>
   
         </a>
   
   
         <!-- NAVIGATION --
   
         <nav class="hidden items-center gap-1 lg:flex">
   
           <a
             href="#welcome"
             class="rounded-xl px-3 py-2.5 text-sm font-semibold transition hover:bg-white/5"
             [ngStyle]="{
               color: themeService.TextSecondaire
             }"
           >
             Accueil
           </a>
   
           <a
             href="#univers"
             class="rounded-xl px-3 py-2.5 text-sm font-semibold transition hover:bg-white/5"
             [ngStyle]="{
               color: themeService.TextSecondaire
             }"
           >
             L'univers
           </a>
   
           <a
             href="#fonctionnalites"
             class="rounded-xl px-3 py-2.5 text-sm font-semibold transition hover:bg-white/5"
             [ngStyle]="{
               color: themeService.TextSecondaire
             }"
           >
             Fonctionnalités
           </a>
   
           <a
             href="#parcours"
             class="rounded-xl px-3 py-2.5 text-sm font-semibold transition hover:bg-white/5"
             [ngStyle]="{
               color: themeService.TextSecondaire
             }"
           >
             Parcours
           </a>
   
           <a
             href="#roles"
             class="rounded-xl px-3 py-2.5 text-sm font-semibold transition hover:bg-white/5"
             [ngStyle]="{
               color: themeService.TextSecondaire
             }"
           >
             Rôles
           </a>
   
           <a
             href="#faq"
             class="rounded-xl px-3 py-2.5 text-sm font-semibold transition hover:bg-white/5"
             [ngStyle]="{
               color: themeService.TextSecondaire
             }"
           >
             FAQ
           </a>
   
         </nav>
   
   
         <!-- ACTIONS --
   
         <div class="flex items-center gap-2">
   
           <a
             routerLink="/login"
             class="
               hidden rounded-xl px-4 py-2.5
               text-sm font-bold transition
               hover:bg-white/5 sm:block
             "
             [ngStyle]="{
               color: themeService.TextSecondaire
             }"
           >
             Se connecter
           </a>
   
           <a
             routerLink="/register"
             class="
               group relative overflow-hidden
               rounded-xl px-4 py-2.5
               text-sm font-black
               shadow-lg transition duration-300
               hover:-translate-y-0.5
             "
             [ngStyle]="{
               background: themeService.Primary,
               color: themeService.TextOnPrimary,
               boxShadow: themeService.BoxShadowPrimary
             }"
           >
   
             <span class="relative z-10">
   
               <span class="hidden sm:inline">
                 Commencer l'aventure
               </span>
   
               <span class="sm:hidden">
                 Commencer
               </span>
   
             </span>
   
             <span
               class="
                 absolute inset-0
                 -translate-x-full
                 bg-white/20
                 transition duration-500
                 group-hover:translate-x-0
               "
             ></span>
   
           </a>
   
         </div>
   
       </div>
   
     </header>
   
   
     <!-- ============================================================
          MAIN
          ============================================================ --
   
     <main>
   
   
       <!-- ============================================================
            HERO
            ============================================================ --
   
       <section
         id="welcome"
         class="
           relative isolate overflow-hidden
           px-4 py-14
           sm:px-6 sm:py-20
           lg:px-10 lg:py-28
           xl:px-14
         "
         [ngStyle]="{
           background: themeService.BackgroundHero
         }"
       >
   
         <!-- DECORATIONS --
   
         <div
           class="
             pointer-events-none absolute
             -left-40 -top-40
             h-96 w-96
             rounded-full
             opacity-20 blur-3xl
           "
           [ngStyle]="{
             background: themeService.Primary
           }"
         ></div>
   
         <div
           class="
             pointer-events-none absolute
             -bottom-40 -right-40
             h-96 w-96
             rounded-full
             opacity-20 blur-3xl
           "
           [ngStyle]="{
             background: themeService.Accent
           }"
         ></div>
   
   
         <div
           class="
             relative mx-auto grid
             w-full max-w-[1500px]
             items-center gap-12
             lg:grid-cols-[0.9fr_1.1fr]
             xl:gap-20
           "
         >
   
           <!-- CONTENT --
   
           <div class="relative z-10">
   
             <div
               class="
                 mb-6 inline-flex
                 items-center gap-2
                 rounded-full border
                 px-3 py-2
                 text-xs font-bold
                 shadow-sm backdrop-blur-md
               "
               [ngStyle]="{
                 background: themeService.GlassBackground,
                 borderColor: themeService.BorderPrimary,
                 color: themeService.TextPrincipal
               }"
             >
   
               <span
                 class="h-2 w-2 animate-pulse rounded-full"
                 [ngStyle]="{
                   background: themeService.Primary
                 }"
               ></span>
   
               Bienvenue dans votre aventure botanique
   
             </div>
   
   
             <h1
               class="
                 max-w-4xl
                 text-4xl font-black
                 leading-[1.02] tracking-tight
                 sm:text-5xl
                 lg:text-6xl
                 xl:text-7xl
               "
               [ngStyle]="{
                 color: themeService.TextPrincipal
               }"
             >
               Découvrez le monde
   
               <span
                 class="block"
                 [ngStyle]="{
                   color: themeService.Primary
                 }"
               >
                 végétal autrement.
               </span>
             </h1>
   
   
             <p
               class="
                 mt-6 max-w-2xl
                 text-base leading-7
                 sm:text-lg sm:leading-8
               "
               [ngStyle]="{
                 color: themeService.TextSecondaire
               }"
             >
               JardiScan vous accompagne pour découvrir,
               identifier et comprendre les plantes qui vous
               entourent grâce à une expérience moderne,
               simple et accessible.
             </p>
   
   
             <!-- CTA --
   
             <div
               class="
                 mt-8 flex flex-col gap-3
                 sm:flex-row sm:flex-wrap
               "
             >
   
               <a
                 routerLink="/register"
                 class="
                   group inline-flex
                   items-center justify-center
                   gap-2 rounded-2xl
                   px-6 py-4
                   text-sm font-black
                   shadow-xl transition
                   hover:-translate-y-1
                 "
                 [ngStyle]="{
                   background: themeService.Primary,
                   color: themeService.TextOnPrimary,
                   boxShadow: themeService.BoxShadowPrimary
                 }"
               >
                 Créer mon compte
   
                 <span
                   class="transition group-hover:translate-x-1"
                 >
                   →
                 </span>
   
               </a>
   
   
               <a
                 routerLink="/login"
                 class="
                   inline-flex
                   items-center justify-center
                   rounded-2xl border
                   px-6 py-4
                   text-sm font-bold
                   backdrop-blur-md
                   transition hover:-translate-y-1
                 "
                 [ngStyle]="{
                   background: themeService.GlassBackground,
                   borderColor: themeService.Border1,
                   color: themeService.TextPrincipal
                 }"
               >
                 J'ai déjà un compte
               </a>
   
             </div>
   
   
             <!-- TRUST --
   
             <div
               class="
                 mt-8 flex flex-wrap
                 items-center gap-x-6 gap-y-3
                 text-xs font-semibold
               "
               [ngStyle]="{
                 color: themeService.TextMuted
               }"
             >
   
               <span>✓ Interface moderne</span>
               <span>✓ Expérience accessible</span>
               <span>✓ Découverte simplifiée</span>
   
             </div>
   
           </div>
   
   
           <!-- HERO IMAGE --
   
           <div
             class="
               relative min-h-[420px]
               sm:min-h-[520px]
               lg:min-h-[620px]
             "
           >
   
             <div
               class="
                 absolute inset-0
                 overflow-hidden
                 rounded-[2rem]
                 border shadow-2xl
                 sm:rounded-[2.5rem]
               "
               [ngStyle]="{
                 borderColor: themeService.Border1,
                 boxShadow: themeService.BoxShadowLarge
               }"
             >
   
               <img
                 [src]="themeService.ImageFondWelcome"
                 alt="Nature et végétation"
                 class="
                   h-full w-full
                   object-cover
                   transition duration-700
                   hover:scale-105
                 "
               />
   
               <div
                 class="
                   absolute inset-0
                   bg-gradient-to-t
                   from-black/80
                   via-black/20
                   to-transparent
                 "
               ></div>
   
   
               <div
                 class="
                   absolute bottom-7
                   left-6 right-6
                   sm:bottom-10 sm:left-10
                 "
               >
   
                 <span
                   class="
                     text-xs font-bold
                     uppercase tracking-[0.25em]
                     text-white/60
                   "
                 >
                   JardiScan
                 </span>
   
                 <h2
                   class="
                     mt-3 max-w-xl
                     text-3xl font-black
                     leading-tight text-white
                     sm:text-4xl
                   "
                 >
                   Regardez la nature.
                   Comprenez-la.
                   Explorez-la.
                 </h2>
   
               </div>
   
             </div>
   
   
             <!-- FLOATING CARD --
   
             <div
               class="
                 absolute -left-3 top-8 z-20
                 hidden w-60
                 rounded-2xl border
                 p-4 shadow-2xl
                 backdrop-blur-xl
                 sm:block lg:-left-8
               "
               [ngStyle]="{
                 background: themeService.GlassBackground,
                 borderColor: themeService.Border1,
                 boxShadow: themeService.BoxShadowMedium
               }"
             >
   
               <div class="flex items-center gap-3">
   
                 <div
                   class="
                     flex h-12 w-12
                     shrink-0 items-center
                     justify-center
                     rounded-xl text-xl
                   "
                   [ngStyle]="{
                     background: themeService.PrimarySoft
                   }"
                 >
                   🔎
                 </div>
   
                 <div>
   
                   <p
                     class="text-xs"
                     [ngStyle]="{
                       color: themeService.TextMuted
                     }"
                   >
                     Exploration
                   </p>
   
                   <p
                     class="text-sm font-black"
                     [ngStyle]="{
                       color: themeService.TextPrincipal
                     }"
                   >
                     Identifier une plante
                   </p>
   
                 </div>
   
               </div>
   
             </div>
   
   
             <!-- FLOATING CARD 2 --
   
             <div
               class="
                 absolute -bottom-5
                 -right-3 z-20
                 w-64
                 rounded-2xl border
                 p-4 shadow-2xl
                 backdrop-blur-xl
                 sm:-right-5 lg:-right-8
               "
               [ngStyle]="{
                 background: themeService.GlassBackground,
                 borderColor: themeService.Border1,
                 boxShadow: themeService.BoxShadowLarge
               }"
             >
   
               <div class="flex items-start gap-3">
   
                 <div
                   class="
                     flex h-12 w-12
                     shrink-0 items-center
                     justify-center
                     rounded-xl text-xl
                   "
                   [ngStyle]="{
                     background: themeService.PrimarySoft
                   }"
                 >
                   🌱
                 </div>
   
                 <div>
   
                   <p
                     class="text-xs"
                     [ngStyle]="{
                       color: themeService.TextMuted
                     }"
                   >
                     Votre prochaine découverte
                   </p>
   
                   <p
                     class="mt-1 text-sm font-black"
                     [ngStyle]="{
                       color: themeService.TextPrincipal
                     }"
                   >
                     Commencez votre exploration
                   </p>
   
                   <div
                     class="
                       mt-3 h-1.5
                       overflow-hidden rounded-full
                     "
                     [ngStyle]="{
                       background: themeService.Border1
                     }"
                   >
   
                     <div
                       class="
                         h-full w-3/4
                         rounded-full
                       "
                       [ngStyle]="{
                         background: themeService.Primary
                       }"
                     ></div>
   
                   </div>
   
                 </div>
   
               </div>
   
             </div>
   
           </div>
   
         </div>
   
       </section>
   
   
       <!-- ============================================================
            STATISTIQUES / PROMESSE
            ============================================================ --
   
       <section
         class="
           px-4 py-10
           sm:px-6
           lg:px-10
           xl:px-14
         "
       >
   
         <div
           class="
             mx-auto grid
             w-full max-w-[1400px]
             overflow-hidden
             rounded-[2rem]
             border
             sm:grid-cols-2
             lg:grid-cols-4
           "
           [ngStyle]="{
             background: themeService.Card,
             borderColor: themeService.Border1
           }"
         >
   
           <div
             class="
               border-b p-6
               sm:border-r
               lg:border-b-0
             "
             [ngStyle]="{
               borderColor: themeService.Border1
             }"
           >
   
             <div class="text-3xl">🌿</div>
   
             <p
               class="mt-4 text-2xl font-black"
               [ngStyle]="{
                 color: themeService.TextPrincipal
               }"
             >
               Découvrir
             </p>
   
             <p
               class="mt-2 text-sm leading-6"
               [ngStyle]="{
                 color: themeService.TextMuted
               }"
             >
               Explorez le monde végétal autour de vous.
             </p>
   
           </div>
   
   
           <div
             class="
               border-b p-6
               lg:border-b-0 lg:border-r
             "
             [ngStyle]="{
               borderColor: themeService.Border1
             }"
           >
   
             <div class="text-3xl">🔎</div>
   
             <p
               class="mt-4 text-2xl font-black"
               [ngStyle]="{
                 color: themeService.TextPrincipal
               }"
             >
               Identifier
             </p>
   
             <p
               class="mt-2 text-sm leading-6"
               [ngStyle]="{
                 color: themeService.TextMuted
               }"
             >
               Apprenez à reconnaître vos découvertes.
             </p>
   
           </div>
   
   
           <div
             class="
               border-b p-6
               sm:border-r
               lg:border-b-0
             "
             [ngStyle]="{
               borderColor: themeService.Border1
             }"
           >
   
             <div class="text-3xl">📚</div>
   
             <p
               class="mt-4 text-2xl font-black"
               [ngStyle]="{
                 color: themeService.TextPrincipal
               }"
             >
               Apprendre
             </p>
   
             <p
               class="mt-2 text-sm leading-6"
               [ngStyle]="{
                 color: themeService.TextMuted
               }"
             >
               Comprenez mieux les plantes rencontrées.
             </p>
   
           </div>
   
   
           <div class="p-6">
   
             <div class="text-3xl">✨</div>
   
             <p
               class="mt-4 text-2xl font-black"
               [ngStyle]="{
                 color: themeService.TextPrincipal
               }"
             >
               Partager
             </p>
   
             <p
               class="mt-2 text-sm leading-6"
               [ngStyle]="{
                 color: themeService.TextMuted
               }"
             >
               Participez progressivement à l'univers JardiScan.
             </p>
   
           </div>
   
         </div>
   
       </section>
   
   
       <!-- ============================================================
            UNIVERS
            ============================================================ --
   
       <section
         id="univers"
         class="
           px-4 py-20
           sm:px-6
           lg:px-10 lg:py-28
           xl:px-14
         "
       >
   
         <div
           class="
             mx-auto grid
             w-full max-w-[1400px]
             gap-12
             lg:grid-cols-2
             lg:items-center
           "
         >
   
           <div>
   
             <span
               class="
                 text-sm font-black
                 uppercase tracking-[0.2em]
               "
               [ngStyle]="{
                 color: themeService.Primary
               }"
             >
               🌱 L'univers JardiScan
             </span>
   
             <h2
               class="
                 mt-4
                 text-3xl font-black
                 tracking-tight
                 sm:text-4xl
                 lg:text-5xl
               "
               [ngStyle]="{
                 color: themeService.TextPrincipal
               }"
             >
               Une application pensée
               pour observer autrement.
             </h2>
   
             <p
               class="
                 mt-6
                 text-base leading-8
                 sm:text-lg
               "
               [ngStyle]="{
                 color: themeService.TextSecondaire
               }"
             >
               JardiScan rassemble plusieurs outils autour
               d'une même idée : rendre la découverte des
               plantes plus simple, intuitive et agréable.
             </p>
   
             <p
               class="mt-4 text-base leading-8"
               [ngStyle]="{
                 color: themeService.TextMuted
               }"
             >
               Votre espace évolue ensuite selon votre compte,
               votre rôle et les autorisations qui vous sont
               attribuées.
             </p>
   
   
             <div class="mt-8 grid gap-3 sm:grid-cols-2">
   
               <div
                 class="rounded-2xl border p-4"
                 [ngStyle]="{
                   background: themeService.Card,
                   borderColor: themeService.Border1
                 }"
               >
                 <span class="text-2xl">👀</span>
   
                 <p
                   class="mt-3 font-black"
                   [ngStyle]="{
                     color: themeService.TextPrincipal
                   }"
                 >
                   Observer
                 </p>
   
                 <p
                   class="mt-1 text-sm"
                   [ngStyle]="{
                     color: themeService.TextMuted
                   }"
                 >
                   Prenez le temps de regarder votre environnement.
                 </p>
   
               </div>
   
   
               <div
                 class="rounded-2xl border p-4"
                 [ngStyle]="{
                   background: themeService.Card,
                   borderColor: themeService.Border1
                 }"
               >
                 <span class="text-2xl">🧠</span>
   
                 <p
                   class="mt-3 font-black"
                   [ngStyle]="{
                     color: themeService.TextPrincipal
                   }"
                 >
                   Comprendre
                 </p>
   
                 <p
                   class="mt-1 text-sm"
                   [ngStyle]="{
                     color: themeService.TextMuted
                   }"
                 >
                   Transformez chaque découverte en connaissance.
                 </p>
   
               </div>
   
             </div>
   
           </div>
   
   
           <!-- VISUAL --
   
           <div
             class="
               relative
               min-h-[420px]
               overflow-hidden
               rounded-[2rem]
               border
             "
             [ngStyle]="{
               background: themeService.Card,
               borderColor: themeService.Border1
             }"
           >
   
             <img
               [src]="themeService.ImageFondWelcome"
               alt="Découverte de la nature avec JardiScan"
               class="
                 absolute inset-0
                 h-full w-full
                 object-cover
                 opacity-70
               "
             />
   
             <div
               class="
                 absolute inset-0
                 bg-gradient-to-br
                 from-black/10
                 via-black/20
                 to-black/80
               "
             ></div>
   
   
             <div
               class="
                 absolute
                 left-5 right-5
                 top-5
                 grid grid-cols-2
                 gap-3
                 sm:left-8 sm:right-8 sm:top-8
               "
             >
   
               <div
                 class="
                   rounded-2xl
                   border
                   p-4
                   backdrop-blur-xl
                 "
                 [ngStyle]="{
                   background: themeService.GlassBackground,
                   borderColor: themeService.GlassBorder
                 }"
               >
   
                 <p class="text-2xl">🌿</p>
   
                 <p
                   class="mt-2 text-sm font-black"
                   [ngStyle]="{
                     color: themeService.TextPrincipal
                   }"
                 >
                   Nature
                 </p>
   
               </div>
   
   
               <div
                 class="
                   rounded-2xl
                   border
                   p-4
                   backdrop-blur-xl
                 "
                 [ngStyle]="{
                   background: themeService.GlassBackground,
                   borderColor: themeService.GlassBorder
                 }"
               >
   
                 <p class="text-2xl">🔬</p>
   
                 <p
                   class="mt-2 text-sm font-black"
                   [ngStyle]="{
                     color: themeService.TextPrincipal
                   }"
                 >
                   Découverte
                 </p>
   
               </div>
   
             </div>
   
   
             <div
               class="
                 absolute bottom-6
                 left-6 right-6
                 sm:bottom-8 sm:left-8 sm:right-8
               "
             >
   
               <p
                 class="text-xs font-bold uppercase tracking-widest text-white/60"
               >
                 Explorer différemment
               </p>
   
               <p
                 class="
                   mt-2
                   text-2xl font-black
                   text-white
                   sm:text-3xl
                 "
               >
                 Chaque plante peut devenir
                 une nouvelle découverte.
               </p>
   
             </div>
   
           </div>
   
         </div>
   
       </section>
   
   
       <!-- ============================================================
            FONCTIONNALITÉS
            ============================================================ --
   
       <section
         id="fonctionnalites"
         class="
           relative overflow-hidden
           px-4 py-20
           sm:px-6
           lg:px-10 lg:py-28
           xl:px-14
         "
         [ngStyle]="{
           background: themeService.Background2
         }"
       >
   
         <div
           class="
             pointer-events-none absolute
             -right-32 top-0
             h-96 w-96
             rounded-full
             opacity-10 blur-3xl
           "
           [ngStyle]="{
             background: themeService.Primary
           }"
         ></div>
   
   
         <div class="relative mx-auto w-full max-w-[1400px]">
   
           <div class="max-w-3xl">
   
             <span
               class="
                 text-sm font-black
                 uppercase tracking-[0.2em]
               "
               [ngStyle]="{
                 color: themeService.Primary
               }"
             >
               ✨ Fonctionnalités
             </span>
   
             <h2
               class="
                 mt-4
                 text-3xl font-black
                 tracking-tight
                 sm:text-4xl
                 lg:text-5xl
               "
               [ngStyle]="{
                 color: themeService.TextPrincipal
               }"
             >
               Tout un univers autour
               des plantes.
