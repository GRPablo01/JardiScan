<!-- ============================================================
     🖥️ TYPE D'ÉCRAN — BADGE COIN HAUT GAUCHE
     • Position : haut gauche
     • Premium glass
     • Responsive
     • Breakpoint affiché en badge
============================================================ -->

<div
  class="
    absolute
    top-4
    left-4
    z-20

    inline-flex
    max-w-[calc(100%-2rem)]
    items-center
    gap-2.5

    rounded-2xl
    border
    border-white/[0.10]
    bg-white/[0.06]
    px-3
    py-2

    shadow-lg
    shadow-black/10
    backdrop-blur-xl

    transition-all
    duration-300

    max-[639px]:top-3
    max-[639px]:left-3
    max-[639px]:gap-2
    max-[639px]:rounded-xl
    max-[639px]:px-2.5
    max-[639px]:py-1.5
  "
>
  <!-- Emoji -->
  <div
    class="
      flex
      h-8
      w-8
      shrink-0
      items-center
      justify-center
      rounded-xl
      bg-gradient-to-br
      from-rose-500/20
      to-blue-500/20
      text-[18px]
      max-[639px]:h-7
      max-[639px]:w-7
      max-[639px]:text-[16px]
    "
  >
    {{ typeEcran.split(' ')[0] }}
  </div>

  <!-- Informations -->
  <div class="flex min-w-0 flex-col">
    <!-- Type d'écran -->
    <div
      class="
        truncate
        text-[11px]
        font-black
        uppercase
        tracking-wide
        text-black
        max-[639px]:text-[10px]
      "
    >
      {{ typeEcran.substring(typeEcran.indexOf(' ') + 1) }}
    </div>

    <!-- Breakpoint -->
    <span
      class="
        mt-1
        inline-flex
        w-fit
        items-center

        rounded-full
        border
        border-rose-400/20
        bg-rose-500/10

        px-2
        py-0.5

        text-[8px]
        font-bold
        leading-none
        tracking-wide
        text-rose-400

        max-[639px]:text-[7px]
      "
    >
      {{ breakpoint }}
    </span>
  </div>
</div>
