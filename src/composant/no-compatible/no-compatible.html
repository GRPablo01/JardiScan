<!-- ============================================================
     PAGE 404 — ARBORIA
     Angular standalone + Tailwind CSS
     • Mise en page responsive avec Tailwind
     • Animations conservées en CSS personnalisé
     • Navigation Angular avec RouterLink
============================================================ -->

<section

  class="flex min-h-[70vh] bg-white w-full items-center justify-center
         px-4 py-8 sm:px-6 sm:py-12 lg:py-16"
  aria-labelledby="error-title"
>
  <div
    class="mx-auto flex w-full max-w-[480px] flex-col
           items-center text-center"
  >

    <!-- ILLUSTRATION 404 -->
    <div
      class="error-image-container flex w-full items-center
             justify-center"
    >
      <img
        src="assets/ImageNoCompatible.png"
        alt="Robot jardinier avec le nombre 404"
        class="error-illustration block h-auto w-full max-w-[440px]
               object-contain"
        fetchpriority="high"
      />
    </div>

    <!-- TITRE -->
    <h2
      id="error-title"
      class="mt-5 text-2xl font-bold leading-tight
             tracking-tight text-[#123A24]
             sm:mt-6 sm:text-3xl"
    >
      Oups&nbsp;! Cette page n'existe pas
    </h2>

    <!-- DESCRIPTION -->
    <p
      class="mt-3 max-w-[420px] text-sm leading-7
             text-[#3C5347] sm:text-base"
    >
      La page que vous recherchez semble introuvable.
      <br class="hidden sm:block" />
      Elle a peut-être été déplacée, supprimée ou n'existe plus.
    </p>

    <!-- RETOUR À L'ACCUEIL -->
    <a
      routerLink="/"
      class="home-btn mt-6 inline-flex min-h-12 items-center
             justify-center gap-2.5 rounded-full
             bg-gradient-to-b from-[#3CB563] to-[#1F8A3B]
             px-6 py-3 text-sm font-semibold text-white
             shadow-[0_8px_20px_rgba(31,138,59,0.30)]
             transition-[transform,box-shadow] duration-200
             ease-out hover:-translate-y-0.5
             hover:shadow-[0_12px_26px_rgba(31,138,59,0.40)]
             focus-visible:outline-none
             focus-visible:ring-4 focus-visible:ring-[#3CB563]/40
             active:translate-y-0
             sm:px-7 sm:text-base"
      aria-label="Retourner à la page d'accueil d'Arboria"
    >
      <!-- Icône accueil -->
      <svg
        viewBox="0 0 24 24"
        width="18"
        height="18"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
        aria-hidden="true"
        class="shrink-0"
      >
        <path d="M3 10.5 12 3l9 7.5" />
        <path d="M5 9.5V21h14V9.5" />
      </svg>

      <span>Retour à l'accueil</span>
    </a>

  </div>
</section>

<style>


/* ============================================================
   ANIMATIONS UNIQUEMENT — ARBORIA
   La mise en page est gérée par Tailwind CSS.
============================================================ */

/* Illustration */
.error-illustration {
  display: block;
  height: auto;
}

/* Compatibilité avec les animations de l'illustration SVG,
   si elles sont utilisées dans une autre version de l'image. */
.float-leaf,
.float-q {
  animation: floaty 5s ease-in-out infinite;
  transform-box: fill-box;
  transform-origin: center;
}

.l2 {
  animation-duration: 6.5s;
  animation-delay: 0.8s;
}

.l3 {
  animation-duration: 7s;
  animation-delay: 1.4s;
}

.q2 {
  animation-duration: 5.6s;
  animation-delay: 0.5s;
}

/* Mouvement flottant */
@keyframes floaty {
  0%,
  100% {
    transform: translateY(0) rotate(0deg);
  }

  50% {
    transform: translateY(-12px) rotate(6deg);
  }
}

/* Pulsation */
.pulse {
  animation: pulse 2.6s ease-in-out infinite;
}

@keyframes pulse {
  0%,
  100% {
    opacity: 1;
  }

  50% {
    opacity: 0.65;
  }
}

/* Accessibilité : réduire les animations si demandé */
@media (prefers-reduced-motion: reduce) {
  .float-leaf,
  .float-q,
  .pulse {
    animation: none !important;
  }
}

</style>
