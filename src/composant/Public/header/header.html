
<!-- ============================================================
     ARBORIA — HEADER PREMIUM MODULAIRE
     Angular Standalone + Tailwind CSS + Font Awesome

     • Hauteur fixe : 76px sur tous les écrans
     • Groupe gauche : Logo + Navigation desktop
     • Groupe droit : Actions
     • Marges horizontales : 20px
     • Palette dynamique via ThemeService
     • Mode clair / sombre
     • Navigation desktop à partir de 920px
     • Navigation mobile / tablette sous 920px
     • Tailwind CSS pour la mise en page
     • Composants Angular et routes existants conservés
============================================================ -->

<header
  class="arboria-header sticky top-0 z-50 w-full h-[76px] shrink-0 overflow-visible border-b backdrop-blur-xl"
  [ngStyle]="{
    'height': '76px',
    'min-height': '76px',
    'max-height': '76px',
    'background-color': themeService.BG1,
    'border-color': themeService.BR1,
    'color': themeService.TX0,
    'box-shadow': '0 4px 24px ' + themeService.SHADOW,
    'font-family': themeService.FONT_BODY
  }"
>
  <nav
    class="mx-auto flex h-[76px] min-h-[76px] max-h-[76px] w-full max-w-[1600px] items-center justify-between gap-2 overflow-visible px-5 lg:gap-4"
    [attr.aria-label]="
      languageService.is('fr')
        ? 'Navigation principale'
        : 'Main navigation'
    "
  >

    <!-- ========================================================
         GROUPE GAUCHE : LOGO + NAVIGATION DESKTOP
    ========================================================= -->

    <div
      class="flex h-full min-w-0 flex-1 items-center gap-2 lg:gap-5 xl:gap-8"
      [ngStyle]="{
        'color': themeService.TX0
      }"
    >

      <!-- LOGO ARBORIA -->

      <div
        class="flex h-full shrink-0 items-center"
        [ngStyle]="{
          'color': themeService.TX0
        }"
      >
        <app-welcome-logo></app-welcome-logo>
      </div>

      <!-- ======================================================
           NAVIGATION DESKTOP
           Visible à partir de 920px inclus
      ======================================================= -->

      <div
        class="hidden h-full min-w-0 items-center min-[920px]:flex"
        [ngStyle]="{
          'color': themeService.TX1
        }"
      >
        <app-welcome-nav></app-welcome-nav>
      </div>

    </div>

    <!-- ========================================================
         GROUPE DROIT : ACTIONS
         Recherche • Thème • Notifications • Profil • Menu mobile
    ========================================================= -->

    <div
      class="ml-auto flex h-full shrink-0 items-center justify-end"
      [ngStyle]="{
        'color': themeService.TX0
      }"
    >
      <app-welcome-action></app-welcome-action>
    </div>

  </nav>
</header>

<!-- ============================================================
     NAVIGATION MOBILE / TABLETTE
     Visible uniquement sous 920px
============================================================ -->

<section
  class="block min-[920px]:hidden"
  [attr.aria-label]="
    languageService.is('fr')
      ? 'Navigation mobile et tablette'
      : 'Mobile and tablet navigation'
  "
>
  <app-welcome-nav></app-welcome-nav>
</section>

<!-- ============================================================
     ANIMATIONS ET TRANSITIONS
     La hauteur du header reste indépendante des animations.
============================================================ -->

<style>
  .arboria-header {
    box-sizing: border-box;
    isolation: isolate;

    height: 76px;
    min-height: 76px;
    max-height: 76px;

    -webkit-backdrop-filter: blur(20px);
    backdrop-filter: blur(20px);

    transition:
      background-color 220ms ease,
      border-color 220ms ease,
      box-shadow 220ms ease,
      color 220ms ease;
  }

  .arboria-header,
  .arboria-header * {
    box-sizing: border-box;
  }

  .arboria-header > nav {
    height: 76px;
    min-height: 76px;
    max-height: 76px;
  }

  .arboria-header a,
  .arboria-header button,
  .arboria-header input,
  .arboria-header select,
  .arboria-header textarea {
    font-family: var(--arboria-font-body, inherit);
    -webkit-tap-highlight-color: transparent;
  }

  .arboria-header a,
  .arboria-header button {
    transition:
      color 180ms ease,
      background-color 180ms ease,
      border-color 180ms ease,
      box-shadow 180ms ease,
      opacity 180ms ease;
  }

  @media (max-width: 639px) {
    .arboria-header {
      -webkit-backdrop-filter: blur(16px);
      backdrop-filter: blur(16px);
    }
  }

  @media (prefers-reduced-motion: reduce) {
    .arboria-header,
    .arboria-header * {
      scroll-behavior: auto !important;
      transition-duration: 0.01ms !important;
      animation-duration: 0.01ms !important;
      animation-iteration-count: 1 !important;
    }
  }
</style>
