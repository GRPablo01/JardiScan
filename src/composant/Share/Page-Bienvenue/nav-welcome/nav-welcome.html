<aside
class="
  hidden
  lg:flex
  fixed
  left-5
  top-20
  xl:top-24
  2xl:top-24
  bottom-4
  z-50
  w-[260px]
  flex-col
  overflow-hidden
  rounded-[1.75rem]
  border
"
[ngStyle]="{
  'background-color': themeService.BG2,
  'border-color': themeService.BR2,
  'color': themeService.TX0,
  'box-shadow':
    '0 20px 55px rgba(15,23,42,0.07), 0 5px 18px rgba(15,23,42,0.035)'
}"
aria-label="Navigation principale"
>

<!-- ==========================================================
    CONTENU PRINCIPAL
    ========================================================== -->

<div
  class="
    flex
    min-h-0
    flex-1
    flex-col
    overflow-y-auto
    overflow-x-hidden
    px-4
    pt-5
    pb-4
    scroll-smooth
    [scrollbar-width:none]
    [-ms-overflow-style:none]
    [&::-webkit-scrollbar]:hidden
  "
>

  <!-- ========================================================
      EN-TÊTE SIDEBAR
      ======================================================== -->

  <div
    class="
      mb-5
      flex
      items-center
      justify-between
      px-2
    "
  >

    <!-- IDENTITÉ NATUREORA -->

    <div
      class="
        flex
        min-w-0
        items-center
        gap-3
      "
    >

      <!-- LOGO -->

      <div
        class="
          flex
          h-10
          w-10
          shrink-0
          items-center
          justify-center
          rounded-[0.85rem]
          shadow-sm
        "
        [ngStyle]="{
          'background-color': themeService.BUTON1BG
        }"
      >
        <i
          class="
            fa-solid
            fa-leaf
            text-[15px]
          "
          [ngStyle]="{
            'color': themeService.BG1
          }"
          aria-hidden="true"
        ></i>
      </div>

      <!-- NOM -->

      <div class="min-w-0">

        <p
          class="
            truncate
            text-[0.98rem]
            font-bold
            tracking-[-0.025em]
          "
          [ngStyle]="{
            'color': themeService.TX0
          }"
        >
          Natureora
        </p>

        <p
          class="
            mt-0.5
            truncate
            text-[0.62rem]
            font-medium
          "
          [ngStyle]="{
            'color': themeService.TX2
          }"
        >
          Jardin & conseils
        </p>

      </div>

    </div>


    <!-- BOUTON VISUEL -->

    <span
      class="
        flex
        h-7
        w-7
        shrink-0
        items-center
        justify-center
        rounded-lg
        border
        transition-all
        duration-200
      "
      [ngStyle]="{
        'background-color': themeService.BG3,
        'border-color': themeService.BR2,
        'color': themeService.TX2
      }"
      aria-hidden="true"
    >
      <i
        class="
          fa-solid
          fa-angles-left
          text-[9px]
        "
      ></i>
    </span>

  </div>


  <!-- ========================================================
      SÉPARATEUR
      ======================================================== -->

  <div
    class="
      mb-5
      h-px
      w-full
      shrink-0
    "
    [ngStyle]="{
      'background-color': themeService.BR2
    }"
    aria-hidden="true"
  ></div>


  <!-- ========================================================
      MENU
      ======================================================== -->

  <section class="shrink-0">

    <!-- TITRE -->

    <p
      class="
        mb-2.5
        px-3
        text-[0.64rem]
        font-bold
        uppercase
        tracking-[0.13em]
      "
      [ngStyle]="{
        'color': themeService.TX2
      }"
    >
      Menu
    </p>


    <!-- ======================================================
        LIENS MENU
        ====================================================== -->

    <button
      *ngFor="let item of menuLinks"
      type="button"
      class="
        group
        relative
        mb-1
        flex
        h-[52px]
        w-full
        items-center
        gap-3
        rounded-[1rem]
        border
        px-3
        text-left
        outline-none
        cursor-pointer
        transition-all
        duration-200
        ease-out
        hover:shadow-sm
        active:scale-[0.985]
        focus-visible:ring-2
        focus-visible:ring-offset-2
      "
      [ngStyle]="{
        'background-color':
          pageActive === item.page
            ? themeService.Primary
            : 'transparent',

        'border-color':
          pageActive === item.page
            ? themeService.Primary
            : 'transparent',

        'color':
          pageActive === item.page
            ? themeService.BG1
            : themeService.TX1,

        '--tw-ring-color':
          themeService.Primary,

        '--tw-ring-offset-color':
          themeService.BG2
      }"
      (mouseenter)="
        pageActive !== item.page
          ? null
          : null
      "
      (click)="selectionnerPage(item.page)"
      [attr.aria-current]="
        pageActive === item.page
          ? 'page'
          : null
      "
      [attr.aria-label]="item.label"
    >

      <!-- ====================================================
          HOVER / ACTIF — COUCHE VISUELLE
          ==================================================== -->

      <span
        class="
          pointer-events-none
          absolute
          inset-0
          rounded-[1rem]
          border
          opacity-0
          transition-all
          duration-200
          group-hover:opacity-100
        "
        [ngStyle]="{
          'background-color':
            pageActive === item.page
              ? 'transparent'
              : themeService.BG3,

          'border-color':
            pageActive === item.page
              ? 'transparent'
              : themeService.BR2
        }"
        aria-hidden="true"
      ></span>


      <!-- ====================================================
          INDICATEUR ACTIF
          ==================================================== -->

      <span
        class="
          pointer-events-none
          absolute
          left-0
          top-1/2
          h-7
          w-[3px]
          -translate-y-1/2
          rounded-r-full
          transition-all
          duration-200
        "
        [class.opacity-100]="pageActive === item.page"
        [class.opacity-0]="pageActive !== item.page"
        [ngStyle]="{
          'background-color': themeService.BG1
        }"
        aria-hidden="true"
      ></span>


      <!-- ====================================================
          CONTENU DU LIEN
          ==================================================== -->

      <span
        class="
          relative
          z-10
          flex
          w-full
          min-w-0
          items-center
          gap-3
        "
      >

        <!-- ICÔNE -->

        <span
          class="
            flex
            h-8
            w-8
            shrink-0
            items-center
            justify-center
            rounded-[0.7rem]
            transition-all
            duration-200
            group-hover:scale-[1.04]
          "
          [ngStyle]="{
            'background-color':
              pageActive === item.page
                ? 'rgba(255,255,255,0.14)'
                : themeService.BG3,

            'color':
              pageActive === item.page
                ? themeService.BG1
                : themeService.ICON
          }"
        >
          <i
            [class]="item.icon"
            class="
              text-[13px]
              transition-transform
              duration-200
            "
            [class.scale-105]="pageActive === item.page"
            aria-hidden="true"
          ></i>
        </span>

            min-w-0
            flex-1
            truncate
            text-[0.89rem]
            font-medium
            tracking-[-0.012em]
            transition-colors
            duration-200
          "
          [ngStyle]="{
            'color':
              pageActive === item.page
                ? themeService.BG1
                : themeService.TX1
          }"
        >
          {{ item.label }}
        </span>


        <!-- FLÈCHE ACTIVE -->

        <span
          *ngIf="pageActive === item.page"
          class="
            flex
            h-6
            w-6
            shrink-0
            items-center
            justify-center
            rounded-full
            transition-transform
            duration-200
            group-hover:translate-x-[2px]
          "
          [ngStyle]="{
            'background-color': 'rgba(255,255,255,0.12)'

          aria-hidden="true"
        >
          <i
            class="
              fa-solid
              fa-arrow-right
              text-[9px]
            "
            [ngStyle]="{
              'color': themeService.BG1
            }"
          ></i>
        </span>

      </span>

    </button>

  </section>

            [ngStyle]="{

        </span>

      </span>

    </button>

  </section>

      }"
      aria-hidden="true"
    ></div>
