<!-- ============================================================

     🌿 JARDISCAN — ACTIONS UTILISATEUR

     • Connexion
     • Inscription
     • Sélecteur FR / EN
     • Mobile / tablette : icônes uniquement
     • Laptop / desktop : icônes + texte
     • UI/UX premium
     • Responsive
     • Accessible clavier
     • Focus visible
     • Zones tactiles optimisées
     • ThemeService conservé
     • LanguageService intégré
     • Angular 20 Standalone
     • Tailwind CSS

     RESPONSIVE :

     ─────────────────────────────────────────────────────────────

     < 1024px  → Icônes uniquement
     ≥ 1024px  → Icônes + texte

     ============================================================ -->

<div
  class="
    flex
    items-center
    justify-end
    gap-2
    sm:gap-2.5
  "
  role="group"
  aria-label="Actions utilisateur"
>

  <!-- ==========================================================
       🔐 CONNEXION
       ========================================================== -->

  <a
    routerLink="/login"
    [attr.aria-label]="loginLabel"
    [title]="loginTitle"
    class="
      group
      relative
      flex
      h-11
      min-w-11
      items-center
      justify-center
      gap-2
      overflow-hidden
      rounded-xl
      border
      px-3
      text-sm
      font-bold
      no-underline
      outline-none
      transition-all
      duration-200
      ease-out
      hover:-translate-y-0.5
      hover:bg-black/[0.04]
      dark:hover:bg-white/[0.06]
      focus-visible:ring-2
      focus-visible:ring-offset-2
      active:translate-y-0
      active:scale-[0.98]
      lg:px-4
    "
    [ngStyle]="{
      color: themeService.TextSecondaire,
      borderColor: themeService.Border1,
      '--tw-ring-color': themeService.Primary
    }"
  >

    <!-- Effet de fond au survol -->
    <span
      class="
        pointer-events-none
        absolute
        inset-0
        -translate-x-full
        bg-current
        opacity-[0.04]
        transition-transform
        duration-300
        ease-out
        group-hover:translate-x-0
      "
      aria-hidden="true"
    ></span>

    <!-- Icône connexion -->
    <svg
      class="
        relative
        z-10
        h-5
        w-5
        shrink-0
        transition-transform
        duration-200
        ease-out
        group-hover:translate-x-0.5
      "
      fill="none"
      viewBox="0 0 24 24"
      stroke="currentColor"
      stroke-width="1.8"
      aria-hidden="true"
    >
      <path
        stroke-linecap="round"
        stroke-linejoin="round"
        d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"
      />

      <path
        stroke-linecap="round"
        stroke-linejoin="round"
        d="M10 17l5-5-5-5"
      />

      <path
        stroke-linecap="round"
        stroke-linejoin="round"
        d="M15 12H3"
      />
    </svg>

    <!-- Texte connexion -->
    <span
      class="
        relative
        z-10
        hidden
        whitespace-nowrap
        lg:inline
      "
    >
      {{ loginText }}
    </span>

  </a>


  <!-- ==========================================================
       ✨ INSCRIPTION
       ========================================================== -->

  <a
    routerLink="/register"
    [attr.aria-label]="registerLabel"
    [title]="registerTitle"
    class="
      group
      relative
      flex
      h-11
      min-w-11
      items-center
      justify-center
      gap-2
      overflow-hidden
      rounded-xl
      px-3
      text-sm
      font-black
      no-underline
      outline-none
      shadow-lg
      transition-all
      duration-300
      ease-out
      hover:-translate-y-0.5
      hover:shadow-xl
      focus-visible:ring-2
      focus-visible:ring-offset-2
      active:translate-y-0
      active:scale-[0.97]
      lg:px-4
    "
    [ngStyle]="{
      background: themeService.Primary,
      color:'#FFFFFF',
    }"
  >

    <!-- Halo lumineux -->
    <span
      class="
        pointer-events-none
        absolute
        -inset-10
        rounded-full
        bg-white/10
        opacity-0
        blur-2xl
        transition-opacity
        duration-300
        group-hover:opacity-100
      "
      aria-hidden="true"
    ></span>

    <!-- Reflet animé -->
    <span
      class="
        pointer-events-none
        absolute
        inset-y-0
        left-0
        w-1/2
        -translate-x-[140%]
        skew-x-[-18deg]
        bg-white/20
        transition-transform
        duration-500
        ease-out
        group-hover:translate-x-[280%]
      "
      aria-hidden="true"
    ></span>

    <!-- Icône + -->
    <svg
      class="
        relative
        z-10
        h-5
        w-5
        shrink-0
        transition-transform
        duration-200
        ease-out
        group-hover:rotate-90
      "
      fill="none"
      viewBox="0 0 24 24"
      stroke="currentColor"
      stroke-width="2"
      aria-hidden="true"
    >
      <path
        stroke-linecap="round"
        stroke-linejoin="round"
        d="M12 5v14"
      />

      <path
        stroke-linecap="round"
        stroke-linejoin="round"
        d="M5 12h14"
      />
    </svg>

    <!-- Texte inscription -->
    <span
      class="
        relative
        z-10
        hidden
        whitespace-nowrap
        lg:inline
      "
    >
      {{ registerText }}
    </span>

  </a>

</div>
