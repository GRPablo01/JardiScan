<!-- ============================================================
     ARBORIA — LANGUAGE SELECTOR
     Angular standalone + Tailwind CSS
     • Design minimaliste et premium
     • Icône globe + langue active + chevron
     • Menu déroulant FR / EN
     • Thème clair / sombre via ThemeService
     • Accessible au clavier
============================================================ -->

<div
  class="language-selector relative z-50 shrink-0"
  [ngStyle]="{
    color: themeService.TX0
  }"
  (keydown.escape)="languageMenuOpen = false"
>
  <!-- BOUTON PRINCIPAL -->
  <button
    type="button"
    class="language-selector-trigger group inline-flex h-9
           items-center justify-center gap-2 rounded-xl
           border px-2.5 transition-all duration-200
           focus-visible:outline-none focus-visible:ring-2
           focus-visible:ring-offset-2"
    [ngStyle]="{
      'background-color': languageMenuOpen
        ? themeService.BG2
        : 'transparent',
      'border-color': languageMenuOpen
        ? themeService.BR2
        : 'transparent',
      'color': themeService.TX0
    }"
    [attr.aria-expanded]="languageMenuOpen"
    aria-haspopup="true"
    aria-label="Choisir la langue"
    (click)="languageMenuOpen = !languageMenuOpen"
  >
    <!-- Icône globe -->
    <i
      class="fa-solid fa-globe text-[15px] transition-transform
             duration-300 group-hover:rotate-12"
      aria-hidden="true"
    ></i>

    <!-- Langue actuelle -->
    <span
      class="text-xs font-semibold tracking-wide"
      aria-live="polite"
    >
      {{ currentLanguage === 'fr' ? 'FR' : 'EN' }}
    </span>

    <!-- Chevron -->
    <i
      class="fa-solid fa-chevron-down text-[9px]
             opacity-60 transition-transform duration-200"
      [class.rotate-180]="languageMenuOpen"
      aria-hidden="true"
    ></i>
  </button>

  <!-- MENU DES LANGUES -->
  <div
    *ngIf="languageMenuOpen"
    class="language-selector-menu absolute right-0 top-[calc(100%+8px)]
           z-[100] min-w-[158px] overflow-hidden rounded-2xl
           border p-1.5 shadow-xl"
    [ngStyle]="{
      'background-color': themeService.BG1,
      'border-color': themeService.BR1
    }"
    role="group"
    aria-label="Langues disponibles"
  >
    <!-- FRANÇAIS -->
    <button
      type="button"
      class="language-selector-option flex w-full
             items-center gap-3 rounded-xl px-3 py-2.5
             text-left transition-colors duration-200
             hover:bg-black/5
             dark:hover:bg-white/5
             focus-visible:outline-none focus-visible:ring-2"
      [ngStyle]="{
        color: themeService.TX0,
        'background-color': currentLanguage === 'fr'
          ? themeService.BG2
          : 'transparent'
      }"
      [attr.aria-pressed]="currentLanguage === 'fr'"
      (click)="setLanguage('fr'); languageMenuOpen = false"
    >
      <img
        src="assets/DrapeauFrance.png"
        alt=""
        aria-hidden="true"
        class="h-4 w-5 rounded-sm object-cover shadow-sm"
        draggable="false"
      />

      <span class="flex-1 text-xs font-medium">
        Français
      </span>

      <i
        *ngIf="currentLanguage === 'fr'"
        class="fa-solid fa-check text-xs"
        [ngStyle]="{ color: themeService.Primary }"
        aria-hidden="true"
      ></i>
    </button>

    <!-- ANGLAIS -->
    <button
      type="button"
      class="language-selector-option flex w-full
             items-center gap-3 rounded-xl px-3 py-2.5
             text-left transition-colors duration-200
             hover:bg-black/5
             dark:hover:bg-white/5
             focus-visible:outline-none focus-visible:ring-2"
      [ngStyle]="{
        color: themeService.TX0,
        'background-color': currentLanguage === 'en'
          ? themeService.BG2
          : 'transparent'
      }"
      [attr.aria-pressed]="currentLanguage === 'en'"
      (click)="setLanguage('en'); languageMenuOpen = false"
    >
      <img
        src="assets/DrapeauAnglais.jpg"
        alt=""
        aria-hidden="true"
        class="h-4 w-5 rounded-sm object-cover shadow-sm"
        draggable="false"
      />

      <span class="flex-1 text-xs font-medium">
        English
      </span>

      <i
        *ngIf="currentLanguage === 'en'"
        class="fa-solid fa-check text-xs"
        [ngStyle]="{ color: themeService.Primary }"
        aria-hidden="true"
      ></i>
    </button>
  </div>
</div>

<style>
/* ============================================================
   ARBORIA — LANGUAGE SELECTOR
============================================================ */

.language-selector {
  -webkit-tap-highlight-color: transparent;
}

.language-selector-trigger {
  -webkit-appearance: none;
  appearance: none;
}

.language-selector-trigger:hover {
  background-color: var(--arboria-language-hover, rgba(128, 128, 128, 0.08));
}

.language-selector-option {
  -webkit-appearance: none;
  appearance: none;
}

.language-selector-menu {
  transform-origin: top right;
  animation: arboria-language-menu-in 180ms
    cubic-bezier(0.2, 0.8, 0.2, 1) both;
}

@keyframes arboria-language-menu-in {
  from {
    opacity: 0;
    transform: translateY(-5px) scale(0.97);
  }

  to {
    opacity: 1;
    transform: translateY(0) scale(1);
  }
}

/* Accessibilité : animations réduites */
@media (prefers-reduced-motion: reduce) {
  .language-selector *,
  .language-selector *::before,
  .language-selector *::after {
    animation: none !important;
    transition: none !important;
    scroll-behavior: auto !important;
  }
}
</style>
