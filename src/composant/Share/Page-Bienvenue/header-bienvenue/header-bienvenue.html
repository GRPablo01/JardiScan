<!-- ============================================================
     HEADER — ARBORIA
     Angular standalone + Tailwind CSS

     • Logo toujours à gauche
     • Navigation affichée à partir de 1062px
     • Actions toujours à droite
     • Thème clair / sombre conservé
     • Composants Angular existants conservés
     • Responsive desktop / tablette / mobile
============================================================ --

<header
  class="site-header relative z-[100] w-full font-sans transition-colors duration-300"
  (keydown.escape)="fermerMenus()"
>
  <!-- ========================================================
       NAVIGATION PRINCIPALE
  ========================================================= --
  <div
    class="header-navigation relative w-full transition-colors duration-300"
    (mouseleave)="fermerMenus()"
    [ngStyle]="{
      'background': themeService.BG1,
      'border-bottom': '1px solid ' + themeService.BR1
    }"
  >
    <!-- ======================================================
         BARRE PRINCIPALE
    ======================================================= --
    <div
      class="mx-auto flex min-h-[64px] w-full max-w-[1600px]
             items-center gap-3 px-3
             sm:min-h-[68px] sm:gap-4 sm:px-6
             lg:gap-6 lg:px-9
             xl:gap-8 xl:px-12"
    >
      <!-- ====================================================
           GAUCHE : LOGO + NAVIGATION
      ===================================================== --
      <div
        class="flex min-w-0 flex-1 items-center gap-3
               sm:gap-4 lg:gap-6"
      >
        <!-- LOGO : toujours visible --
        <div class="flex shrink-0 items-center">
          <app-welcome-logo></app-welcome-logo>
        </div>

        <!-- NAVIGATION : visible à partir de 1062px --
        <div class="hidden min-[1062px]:flex min-w-0 flex-1 items-center">
          <app-welcome-nav></app-welcome-nav>
        </div>
      </div>

      <!-- ====================================================
           DROITE : ACTIONS
      ===================================================== --
      <div class="ml-auto flex shrink-0 items-center justify-end">
        <app-welcome-actions></app-welcome-actions>
      </div>
    </div>
  </div>
</header>




<!-- ============================================================
     NAVIGATION MOBILE — ARBORIA
     Visible en dessous de 1062px
     Masquée à partir de 1062px
============================================================ --

<div class="block min-[0px]:min-[1062px]:hidden">
  <app-welcome-nav-mobile></app-welcome-nav-mobile>
</div>
