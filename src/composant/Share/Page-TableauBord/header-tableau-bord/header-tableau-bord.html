<!-- EN-TÊTE -->
<header
class="flex flex-col gap-5 border-b pb-6 xl:flex-row xl:items-center xl:justify-between"
[style.borderColor]="'var(--BR1)'"
>
<div class="min-w-0">
  <div class="mb-4 flex flex-wrap items-center gap-2">
    <span
      class="flex h-10 w-10 items-center justify-center rounded-2xl"
      [style.backgroundColor]="'var(--PrimarySoft)'"
      [style.color]="'var(--Primary)'"
    >
      <i class="fa-solid fa-leaf text-lg" aria-hidden="true"></i>
    </span>

    <span class="text-xs font-extrabold uppercase tracking-[0.2em]">Arboria</span>

    <span class="h-1 w-1 rounded-full" [style.backgroundColor]="'var(--Primary)'"></span>

    <span class="text-xs" [style.color]="'var(--TX2)'">Tableau de bord</span>

    <span
      class="ml-1 inline-flex items-center gap-2 rounded-full border px-3 py-1.5 text-[10px] font-semibold"
      [style.backgroundColor]="'var(--BG3)'"
      [style.borderColor]="'var(--BR1)'"
      [style.color]="'var(--TX1)'"
    >
      <span class="h-1.5 w-1.5 rounded-full" [style.backgroundColor]="'var(--Primary)'"></span>
      Espace botanique
    </span>
  </div>

  <h1
    class="text-3xl font-semibold leading-tight tracking-[-0.045em] sm:text-4xl xl:text-5xl"
    style="font-family:var(--arboria-font-body)"
  >
    Bonjour, bienvenue dans
    <span
      class="font-medium italic"
      style="font-family:var(--arboria-font-display)"
      [style.color]="'var(--Primary)'"
    >
      votre jardin.
    </span>
  </h1>

  <p class="mt-3 max-w-2xl text-sm leading-7 sm:text-base" [style.color]="'var(--TX2)'">
    Votre espace pour retrouver vos plantes, suivre les informations disponibles
    et organiser sereinement leur entretien.
  </p>
</div>

<div class="flex flex-wrap items-center gap-3">
  <div
    class="flex min-h-12 items-center gap-3 rounded-2xl border px-4 py-3"
    [style.backgroundColor]="'var(--BG3)'"
    [style.borderColor]="'var(--BR1)'"
  >
    <i class="fa-regular fa-calendar text-lg" [style.color]="'var(--Primary)'"></i>
    <div>
      <p class="text-[11px]" [style.color]="'var(--TX2)'">Aujourd'hui</p>
      <p class="mt-1 text-sm font-semibold capitalize">
        {{ currentDate | date:'dd MMM yyyy':'':'fr-FR' }}
      </p>
    </div>
  </div>

  <button
    type="button"
    (click)="refreshDashboard()"
    class="group inline-flex min-h-12 items-center gap-2 rounded-2xl border px-4 py-3 text-sm font-semibold transition duration-200 hover:-translate-y-0.5 focus-visible:outline-none focus-visible:ring-2"
    [style.backgroundColor]="'var(--BUTON2BG)'"
    [style.color]="'var(--BUTON2TEXT)'"
    [style.borderColor]="'var(--BUTON2BORDER)'"
    [style.--tw-ring-color]="'var(--Primary)'"
  >
    <i class="fa-solid fa-arrows-rotate transition-transform duration-300 group-hover:rotate-180"></i>
    Actualiser
  </button>
</div>
</header>
