
<!-- ============================================================
     🌗 THEME TOGGLE — ARBORIA
     Angular standalone + Tailwind CSS + ThemeService

     • Icônes soleil / lune conservées
     • Fond transparent par défaut
     • Fond dynamique uniquement au survol
     • Couleurs adaptées au thème clair / sombre
     • Bordure discrète au survol
     • Accessibilité clavier
============================================================ -->

<button
  type="button"
  (click)="toggleTheme()"

  [attr.aria-label]="
    themeService.isDarkMode
      ? 'Activer le thème clair'
      : 'Activer le thème sombre'
  "

  [attr.title]="
    themeService.isDarkMode
      ? 'Passer au thème clair'
      : 'Passer au thème sombre'
  "

  [attr.aria-pressed]="themeService.isDarkMode"

  class="
    theme-toggle
    group
    relative
    inline-flex
    h-9 w-9
    shrink-0
    items-center justify-center
    rounded-xl
    border
    border-transparent
    bg-transparent
    shadow-none
    transition-all
    duration-200
    ease-out
    hover:-translate-y-0.5
    active:scale-95
    focus-visible:outline-none
    focus-visible:ring-2
    focus-visible:ring-[#6F8F72]
    focus-visible:ring-offset-2
    sm:h-10 sm:w-10
  "

  [ngStyle]="{
    'color': themeService.TX0,
    'background-color': 'transparent',
    'border-color': 'transparent',
    'box-shadow': 'none'
  }"

  [ngClass]="{
    'hover:!bg-[#EAE7E7] hover:!border-[#D6D4D4]':
      !themeService.isDarkMode,

    'hover:!bg-[#3B4D45] hover:!border-[#4D5E55]':
      themeService.isDarkMode
  }"
>
  <!-- ==========================================================
       ☀️ THÈME SOMBRE ACTIF → ICÔNE SOLEIL
  =========================================================== -->

  <svg
    *ngIf="themeService.isDarkMode"
    viewBox="0 0 24 24"
    fill="none"
    stroke="currentColor"
    stroke-width="1.7"
    stroke-linecap="round"
    stroke-linejoin="round"
    class="
      h-5 w-5
      animate-[spin_12s_linear_infinite]
      transition-transform
      duration-300
      group-hover:scale-110
    "
    aria-hidden="true"
  >
    <circle cx="12" cy="12" r="4" />

    <path
      d="
        M12 2v2
        m0 16v2
        M4.93 4.93l1.42 1.42
        m11.3 11.3 1.42 1.42
        M2 12h2
        m16 0h2
        M4.93 19.07l1.42-1.42
        m11.3-11.3 1.42-1.42
      "
    />
  </svg>

  <!-- ==========================================================
       🌙 THÈME CLAIR ACTIF → ICÔNE LUNE
  =========================================================== -->

  <svg
    *ngIf="!themeService.isDarkMode"
    viewBox="0 0 24 24"
    fill="none"
    stroke="currentColor"
    stroke-width="1.7"
    stroke-linecap="round"
    stroke-linejoin="round"
    class="
      h-5 w-5
      transition-transform
      duration-300
      group-hover:-rotate-12
      group-hover:scale-110
    "
    aria-hidden="true"
  >
    <path
      d="
        M20.9 13A9 9 0 0 1 11 3.1
        9 9 0 1 0 20.9 13Z
      "
    />

    <path d="M16 3v4m-2-2h4" />
  </svg>
</button>
