
<!-- ============================================================
     ✉️ CONTACT TOGGLE — NATUREORA
     
     PREMIUM NATURE GLASS

     • Light / Dark
     • Français / English
     • Responsive
     • Mobile / Tablet → Popup à droite
     • Laptop / Desktop → Popup sous le bouton
     • Ouverture → DROITE ➜ GAUCHE
     • Glassmorphism naturel
     • 44 × 44
     • Une seule popup ouverte à la fois
     • 100% ThemeService
     • Aucune couleur emerald hardcodée
============================================================= -->

<div
  class="
    contact-wrapper
    relative
    flex
    items-center
    justify-center
  "
  (click)="$event.stopPropagation()"
>

  <!-- ==========================================================
       ✉️ CONTACT BUTTON
  =========================================================== -->

  <button
    type="button"

    [attr.aria-label]="
      currentLanguage === 'fr'
        ? 'Contacter Natureora'
        : 'Contact Natureora'
    "

    [attr.aria-expanded]="isOpen"

    aria-haspopup="menu"

    [title]="
      currentLanguage === 'fr'
        ? 'Contacter Natureora'
        : 'Contact Natureora'
    "

    class="
      contact-button
      group
      relative
      flex
      h-10
      w-10
      shrink-0
      items-center
      justify-center
      overflow-hidden
      rounded-full
      cursor-pointer
      select-none
      transition-all
      duration-200
      hover:scale-[1.04]
      active:scale-95
      focus:outline-none
      focus-visible:ring-2
      sm:h-11
      sm:w-11
    "

    [ngStyle]="{
      'background': themeService.BG2,
      'border': '1px solid ' + themeService.BR2,
      'color': themeService.TX3,
      'box-shadow': '0 6px 18px ' + themeService.SHADOW
    }"

    (mouseenter)="languageButtonHover = true"
    (mouseleave)="languageButtonHover = false"

    (click)="togglePopup($event)"
  >

    <!-- ========================================================
         ✉️ CONTACT ICON
    ========================================================= -->

    <i
      aria-hidden="true"

      [ngStyle]="{
        'color': languageButtonHover || isOpen
          ? themeService.ICON
          : themeService.TX3
      }"

      class="
        fa-regular
        fa-envelope
        relative
        z-10
        text-[15px]
        transition-all
        duration-300
        group-hover:scale-110
        group-hover:-rotate-6
        sm:text-[18px]
      "
    ></i>

  </button>


  <!-- ==========================================================
       ✉️ CONTACT POPUP

       • Mobile / Tablet → right side
       • Desktop → under button
       • Animation droite → gauche
  =========================================================== -->

  <div
    *ngIf="isOpen"

    role="menu"

    [attr.aria-label]="
      currentLanguage === 'fr'
        ? 'Contacter Natureora'
        : 'Contact Natureora'
    "

    class="
      contact-popup
      absolute
      z-[100]
      top-full
      right-0
      left-auto
      mt-2
      lg:mt-3
      w-[300px]
      max-w-[calc(100vw-24px)]
      overflow-hidden
      rounded-2xl
      border
      p-1.5
      backdrop-blur-3xl
      backdrop-saturate-150
      origin-top-right
      animate-[contactPopupRightToLeft_160ms_ease-out]
    "

    [ngStyle]="{
      'background': themeService.BG2,
      'border': '1px solid ' + themeService.BR2,
      'box-shadow': '0 18px 45px ' + themeService.SHADOW
    }"

    (click)="$event.stopPropagation()"
  >

    <!-- ========================================================
         🏷️ POPUP HEADER
    ========================================================= -->

    <div
      class="
        flex
        items-center
        gap-3
        px-3
        pb-2.5
        pt-2.5
      "
    >

      <!-- ICON -->

      <span
        class="
          flex
          h-9
          w-9
          shrink-0
          items-center
          justify-center
          rounded-xl
        "

        [ngStyle]="{
          'background': themeService.BUTON1BG,
          'color': themeService.BUTON1ICON,
          'box-shadow': '0 5px 14px ' + themeService.BUTON1SHADOW
        }"
      >

        <i
          aria-hidden="true"
          class="fa-regular fa-envelope text-[14px]"
        ></i>

      </span>


      <!-- TITLE -->

      <div class="min-w-0 flex-1">

        <p
          class="
            text-[13px]
            font-bold
            tracking-[-0.01em]
          "

          [ngStyle]="{
            'color': themeService.TX0
          }"
        >
          {{
            currentLanguage === 'fr'
              ? 'Contact'
              : 'Contact'
          }}
        </p>


        <p
          class="
            mt-0.5
            text-[11px]
            leading-tight
          "

          [ngStyle]="{
            'color': themeService.TX2
          }"
        >
          {{
            currentLanguage === 'fr'
              ? 'Comment pouvons-nous vous aider ?'
              : 'How can we help you?'
          }}
        </p>

      </div>

    </div>


    <!-- ========================================================
         ✉️ NOUS CONTACTER
    ========================================================= -->

    <button
      type="button"
      role="menuitem"

      class="
        contact-option
        group
        flex
        w-full
        items-center
        gap-3
        rounded-xl
        px-3
        py-2.5
        text-left
        cursor-pointer
        select-none
        transition-all
        duration-150
        hover:scale-[1.015]
        active:scale-[0.98]
      "

      [ngStyle]="{
        'background': themeService.BUTON1BG,
        'color': themeService.BUTON1TEXT,
        'box-shadow': '0 6px 18px ' + themeService.BUTON1SHADOW
      }"

      (click)="openContact($event)"
    >

      <!-- ICON -->

      <span
        class="
          flex
          h-8
          w-8
          shrink-0
          items-center
          justify-center
          rounded-lg
        "

        [ngStyle]="{
          'background': themeService.BUTON1HOVER,
          'color': themeService.BUTON1ICON
        }"
      >

        <i
          aria-hidden="true"
          class="fa-solid fa-paper-plane text-[12px]"
        ></i>

      </span>


      <!-- TEXT -->

      <span class="min-w-0 flex-1">

        <span
          class="
            block
            text-[12px]
            font-semibold
          "
        >
          {{
            currentLanguage === 'fr'
              ? 'Nous contacter'
              : 'Contact us'
          }}
        </span>


        <span
          class="
            mt-0.5
            block
            text-[10px]
            opacity-75
          "
        >
          {{
            currentLanguage === 'fr'
              ? 'Envoyez-nous votre message'
              : 'Send us your message'
          }}
        </span>

      </span>


      <i
        aria-hidden="true"
        class="
          fa-solid
          fa-chevron-right
          text-[9px]
          opacity-70
          transition-transform
          duration-200
          group-hover:translate-x-0.5
        "
      ></i>

    </button>


    <!-- ========================================================
         📚 SEPARATOR
    ========================================================= -->

    <div
      class="
        mx-2
        my-1.5
        h-px
      "

      [ngStyle]="{
        'background': themeService.BR2
      }"
    ></div>


    <!-- ========================================================
         🐛 SIGNALER UN PROBLÈME
    ========================================================= -->

    <button
      type="button"
      role="menuitem"

      class="
        contact-option
        group
        flex
        w-full
        items-center
        gap-3
        rounded-xl
        px-3
        py-2.5
        text-left
        cursor-pointer
        select-none
        transition-all
        duration-150
        hover:scale-[1.015]
        active:scale-[0.98]
      "

      [ngStyle]="{
        'background': themeService.BG3,
        'border': '1px solid ' + themeService.BR3,
        'color': themeService.TX0
      }"

      (mouseenter)="contactProblemHover = true"
      (mouseleave)="contactProblemHover = false"

      (click)="openContactType('problem', $event)"
    >

      <!-- ICON -->

      <span
        class="
          flex
          h-8
          w-8
          shrink-0
          items-center
          justify-center
          rounded-lg
          transition-colors
          duration-150
        "

        [ngStyle]="{
          'background': contactProblemHover
            ? themeService.ErrorSoft
            : themeService.BG4,

          'color': contactProblemHover
            ? themeService.Error
            : themeService.TX2
        }"
      >

        <i
          aria-hidden="true"
          class="fa-solid fa-bug text-[11px]"
        ></i>

      </span>


      <!-- TEXT -->

      <span
        class="
          min-w-0
          flex-1
          text-[12px]
          font-semibold
        "
      >
        {{
          currentLanguage === 'fr'
            ? 'Signaler un problème'
            : 'Report a problem'
        }}
      </span>


      <i
        aria-hidden="true"
        class="
          fa-solid
          fa-chevron-right
          text-[9px]
          opacity-40
          transition-transform
          duration-200
          group-hover:translate-x-0.5
        "
      ></i>

    </button>


    <!-- ========================================================
         💡 SUGGESTION
    ========================================================= -->

    <button
      type="button"
      role="menuitem"

      class="
        contact-option
        group
        flex
        w-full
        items-center
        gap-3
        rounded-xl
        px-3
        py-2.5
        text-left
        cursor-pointer
        select-none
        transition-all
        duration-150
        hover:scale-[1.015]
        active:scale-[0.98]
      "

      [ngStyle]="{
        'background': themeService.BG3,
        'border': '1px solid ' + themeService.BR3,
        'color': themeService.TX0
      }"

      (mouseenter)="contactSuggestionHover = true"
      (mouseleave)="contactSuggestionHover = false"

      (click)="openContactType('suggestion', $event)"
    >

      <!-- ICON -->

      <span
        class="
          flex
          h-8
          w-8
          shrink-0
          items-center
          justify-center
          rounded-lg
          transition-colors
          duration-150
        "

        [ngStyle]="{
          'background': contactSuggestionHover
            ? themeService.WarningSoft
            : themeService.BG4,

          'color': contactSuggestionHover
            ? themeService.Warning
            : themeService.TX2
        }"
      >

        <i
          aria-hidden="true"
          class="fa-solid fa-lightbulb text-[11px]"
        ></i>

      </span>


      <!-- TEXT -->

      <span
        class="
          min-w-0
          flex-1
          text-[12px]
          font-semibold
        "
      >
        {{
          currentLanguage === 'fr'
            ? 'Faire une suggestion'
            : 'Make a suggestion'
        }}
      </span>


      <i
        aria-hidden="true"
        class="
          fa-solid
          fa-chevron-right
          text-[9px]
          opacity-40
          transition-transform
          duration-200
          group-hover:translate-x-0.5
        "
      ></i>

    </button>


    <!-- ========================================================
         📖 SEPARATOR
    ========================================================= -->

    <div
      class="
        mx-2
        my-1.5
        h-px
      "

      [ngStyle]="{
        'background': themeService.BR2
      }"
    ></div>


    <!-- ========================================================
         📖 CENTRE DE CONTACT
    ========================================================= -->

    <button
      type="button"
      role="menuitem"

      class="
        contact-center
        group
        flex
        w-full
        items-center
        gap-3
        rounded-xl
        px-3
        py-2.5
        text-left
        cursor-pointer
        select-none
        transition-all
        duration-150
        hover:scale-[1.015]
        active:scale-[0.98]
      "

      [ngStyle]="{
        'background': themeService.BG3,
        'border': '1px solid ' + themeService.BR3,
        'color': themeService.ICON
      }"

      (mouseenter)="contactCenterHover = true"
      (mouseleave)="contactCenterHover = false"

      (click)="openContactCenter($event)"
    >

      <!-- ICON -->

      <span
        class="
          flex
          h-8
          w-8
          shrink-0
          items-center
          justify-center
          rounded-lg
          transition-all
          duration-150
        "

        [ngStyle]="{
          'background': contactCenterHover
            ? themeService.PrimarySoft
            : themeService.BG4,

          'color': themeService.ICON
        }"
      >

        <i
          aria-hidden="true"
          class="
            fa-solid
            fa-envelope-open-text
            text-[11px]
          "
        ></i>

      </span>


      <!-- TEXT -->

      <span
        class="
          flex-1
          text-[11px]
          font-semibold
        "
      >
        {{
          currentLanguage === 'fr'
            ? 'Centre de contact'
            : 'Contact Center'
        }}
      </span>


      <i
        aria-hidden="true"
        class="
          fa-solid
          fa-arrow-up-right-from-square
          text-[9px]
          opacity-60
          transition-transform
          duration-200
          group-hover:translate-x-0.5
          group-hover:-translate-y-0.5
        "
      ></i>

    </button>


    <!-- ========================================================
         🌿 FOOTER DISCRET
    ========================================================= -->

    <div
      class="
        px-3
        pb-1
        pt-2
        text-center
      "

      [ngStyle]="{
        'color': themeService.TX3
      }"
    >

      <span
        class="
          text-[9px]
          tracking-wide
        "
      >
        Natureora
      </span>

    </div>

  </div>

</div>
