<!-- ============================================================

     ❓ HELP TOGGLE — NATUREORA

     PREMIUM NATURE GLASS

     Responsive :
     • Mobile       → Popup à droite
     • Tablette     → Popup à droite
     • Laptop       → Popup sous le bouton
     • Desktop      → Popup sous le bouton

     • Ouverture → DROITE ➜ GAUCHE
     • Light / Dark
     • Français / English
     • Glassmorphism
     • 44 × 44
     • Aide contextuelle

============================================================= -->

<div
  class="
    help-wrapper
    relative
    flex
    items-center
    justify-center
  "
  (click)="$event.stopPropagation()"
>

  <!-- ==========================================================
       ❓ HELP BUTTON
  =========================================================== -->

  <button
    type="button"
    [attr.aria-label]="
      currentLanguage === 'fr'
        ? 'Aide'
        : 'Help'
    "
    [attr.aria-expanded]="isOpen"
    aria-haspopup="menu"
    [title]="
      currentLanguage === 'fr'
        ? 'Aide'
        : 'Help'
    "
    class="
      help-button
      group
      relative
      flex
      h-10
      w-10
      shrink-0
      items-center
      justify-center
      overflow-hidden
      rounded-full
      cursor-pointer
      select-none
      transition-all
      duration-200
      hover:scale-[1.04]
      active:scale-95
      focus:outline-none
      focus-visible:ring-2
      sm:h-11
      sm:w-11
    "
    [ngStyle]="{
      'color': themeService.TX3,
      'background': themeService.BG2,
      'border': '1px solid ' + themeService.BR2,
      'box-shadow': themeService.SHADOW
    }"
    (click)="togglePopup($event)"
  >

    <!-- ========================================================
         ❓ HELP ICON
    ========================================================= -->

    <i
      aria-hidden="true"
      class="
        fa-regular
        fa-circle-question
        relative
        z-10
        text-[15px]
        transition-all
        duration-300
        group-hover:scale-110
        group-hover:rotate-6
        sm:text-[20px]
      "
      [ngStyle]="{
        'color': languageButtonHover || isOpen
          ? themeService.ICON
          : themeService.TX3
      }"

    ></i>

  </button>


  <!-- ==========================================================
       ❓ HELP POPUP — NATUREORA

       PREMIUM NATURE GLASS

       Responsive :
       • Mobile       → Popup à droite
       • Tablette     → Popup à droite
       • Laptop       → Popup sous le bouton
       • Desktop      → Popup sous le bouton

       Animation :
       • DROITE ➜ GAUCHE
       • Light / Dark
       • Glassmorphism
       • UI identique au Language Popup

  =========================================================== -->

  <div
    *ngIf="isOpen"
    role="menu"
    [attr.aria-label]="
      currentLanguage === 'fr'
        ? 'Aide Natureora'
        : 'Natureora Help'
    "
    class="
      help-popup
      fixed
      z-[99999]
      w-max
      min-w-[285px]
      max-w-[calc(100vw-24px)]
      flex
      flex-col
      rounded-2xl
      p-1.5
      overflow-hidden
      origin-top-right
      animate-[helpPopupRightToLeft_160ms_ease-out]
    "
    [ngStyle]="{
      'top.px': popupTop,
      'left.px': popupLeft,
      'transform': popupTransform,
      'background': themeService.BG1,
      'border': '1px solid ' + themeService.BR2,
      'box-shadow': themeService.SHADOW
    }"
    (click)="$event.stopPropagation()"
  >

    <!-- ========================================================
         🏷️ POPUP HEADER
    ========================================================= -->

    <div
      class="
        flex
        items-center
        gap-3
        rounded-xl
        px-3
        py-2
        select-none
      "
      [ngStyle]="{
        'background': themeService.BG2
      }"
    >

      <!-- ======================================================
           ❓ ICON
      ======================================================= -->

      <span
        class="
          flex
          h-8
          w-8
          shrink-0
          items-center
          justify-center
          rounded-xl
          text-[14px]
        "
        [ngStyle]="{
          'background': themeService.BG3,
          'border': '1px solid ' + themeService.BR2,
          'color': themeService.ICON
        }"
      >
        <i
          aria-hidden="true"
          class="fa-regular fa-circle-question"
        ></i>
      </span>


      <!-- ======================================================
           🏷️ TITLE + DESCRIPTION
      ======================================================= -->

      <div class="min-w-0 flex-1">

        <p
          class="
            text-[13px]
            font-bold
            tracking-[-0.01em]
          "
          [ngStyle]="{
            'color': themeService.TX0
          }"
        >
          {{
            currentLanguage === 'fr'
              ? 'Aide'
              : 'Help'
          }}
        </p>

        <p
          class="
            mt-0.5
            text-[11px]
            leading-tight
          "
          [ngStyle]="{
            'color': themeService.TX2
          }"
        >
          {{
            currentLanguage === 'fr'
              ? 'Comment utiliser Natureora ?'
              : 'How to use Natureora?'
          }}
        </p>

      </div>

    </div>


    <!-- ========================================================
         📚 SEPARATOR
    ========================================================= -->

    <div
      class="
        mx-2
        my-1.5
        h-px
      "
      [ngStyle]="{
        'background': themeService.BR2
      }"
    ></div>


    <!-- ========================================================
         📷 SCANNER UNE PLANTE
    ========================================================= -->

    <button
      type="button"
      routerLink="/scannerplante"
      role="menuitem"
      class="
        help-option
        group
        flex
        w-full
        items-center
        gap-2.5
        rounded-xl
        px-3
        py-2
        text-left
        cursor-pointer
        select-none
        transition-all
        duration-150
        hover:scale-[1.015]
        active:scale-[0.98]
      "
      [ngStyle]="{
        'background': 'transparent',
        'color': themeService.TX0
      }"
      (click)="openHelp('scanner', $event)"
    >

      <!-- ICON -->

      <span
        class="
          flex
          h-7
          w-7
          shrink-0
          items-center
          justify-center
          rounded-lg
          text-[13px]
        "
        [ngStyle]="{
          'background': themeService.BG3,
          'border': '1px solid ' + themeService.BR2,
          'color': themeService.ICON
        }"
      >
        <i
          aria-hidden="true"
          class="fa-solid fa-camera text-[11px]"
        ></i>
      </span>


      <!-- TEXT -->

      <span
        class="
          min-w-0
          flex-1
          text-[12px]
          font-semibold
          tracking-[-0.01em]
        "
      >
        {{
          currentLanguage === 'fr'
            ? 'Scanner une plante'
            : 'Scan a plant'
        }}
      </span>


      <!-- ARROW -->

      <i
        aria-hidden="true"
        class="
          fa-solid
          fa-chevron-right
          text-[9px]
          opacity-35
          transition-transform
          duration-150
          group-hover:translate-x-0.5
        "
        [ngStyle]="{
          'color': themeService.TX3
        }"
      ></i>

    </button>


    <!-- ========================================================
         🌱 MES PLANTES
    ========================================================= -->

    <button
      type="button"
      routerLink="/myplants"
      role="menuitem"
      class="
        help-option
        group
        flex
        w-full
        items-center
        gap-2.5
        rounded-xl
        px-3
        py-2
        text-left
        cursor-pointer
        select-none
        transition-all
        duration-150
        hover:scale-[1.015]
        active:scale-[0.98]
      "
      [ngStyle]="{
        'background': 'transparent',
        'color': themeService.TX0
      }"
      (click)="openHelp('plants', $event)"
    >

      <!-- ICON -->

      <span
        class="
          flex
          h-7
          w-7
          shrink-0
          items-center
          justify-center
          rounded-lg
          text-[13px]
        "
        [ngStyle]="{
          'background': themeService.BG3,
          'border': '1px solid ' + themeService.BR2,
          'color': themeService.ICON
        }"
      >
        <i
          aria-hidden="true"
          class="fa-solid fa-leaf text-[11px]"
        ></i>
      </span>


      <!-- TEXT -->

      <span
        class="
          min-w-0
          flex-1
          text-[12px]
          font-semibold
          tracking-[-0.01em]
        "
      >
        {{
          currentLanguage === 'fr'
            ? 'Mes plantes'
            : 'My plants'
        }}
      </span>


      <!-- ARROW -->

      <i
        aria-hidden="true"
        class="
          fa-solid
          fa-chevron-right
          text-[9px]
          opacity-35
          transition-transform
          duration-150
          group-hover:translate-x-0.5
        "
        [ngStyle]="{
          'color': themeService.TX3
        }"
      ></i>

    </button>


    <!-- ========================================================
         ⚙️ PARAMÈTRES

         Conservé commenté pour ne rien casser.
    ========================================================= -->

    <!-- ========================================================
         📚 SEPARATOR
    ========================================================= -->

    <div
      class="
        mx-2
        my-1.5
        h-px
      "
      [ngStyle]="{
        'background': themeService.BR2
      }"
    ></div>


    <!-- ========================================================
         📖 CENTRE D'AIDE
    ========================================================= -->

    <button
      type="button"
      role="menuitem"
      routerLink="/centreaide"
      class="
        help-center
        group
        flex
        w-full
        items-center
        gap-2.5
        rounded-xl
        px-3
        py-2
        text-left
        cursor-pointer
        select-none
        transition-all
        duration-150
        hover:scale-[1.015]
        active:scale-[0.98]
      "
      [ngStyle]="{
        'background': themeService.BG2,
        'border': '1px solid ' + themeService.BR2,
        'color': themeService.TX0
      }"
      (click)="openHelpCenter($event)"
    >

      <!-- ICON -->

      <span
        class="
          flex
          h-7
          w-7
          shrink-0
          items-center
          justify-center
          rounded-lg
          text-[11px]
        "
        [ngStyle]="{
          'background': themeService.BG3,
          'border': '1px solid ' + themeService.BR2,
          'color': themeService.ICON
        }"
      >
        <i
          aria-hidden="true"
          class="fa-solid fa-book"
        ></i>
      </span>


      <!-- TEXT -->

      <span
        class="
          min-w-0
          flex-1
          text-[11px]
          font-semibold
          tracking-[-0.01em]
        "
      >
        {{
          currentLanguage === 'fr'
            ? "Centre d'aide complet"
            : 'Full Help Center'
        }}
      </span>


      <!-- EXTERNAL ARROW -->

      <i
        aria-hidden="true"
        class="
          fa-solid
          fa-arrow-up-right-from-square
          text-[9px]
          opacity-60
          transition-transform
          duration-150
          group-hover:translate-x-0.5
          group-hover:-translate-y-0.5
        "
        [ngStyle]="{
          'color': themeService.TX3
        }"
      ></i>

    </button>

  </div>

</div>
