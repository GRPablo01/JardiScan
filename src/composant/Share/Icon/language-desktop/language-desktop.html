
<!-- ============================================================

🌐 LANGUAGE TOGGLE — ARBORIA

LAPTOP + DESKTOP UNIQUEMENT

• À partir de 1240px
• Bouton compact et stable
• Bouton NON déplacé
• Popup TOUJOURS directement sous le bouton
• Popup ancrée directement au bouton
• Même comportement laptop / desktop
• Aucun calcul vertical dépendant du viewport
• Aucun margin-top responsive
• Aucun décalage vertical selon l'écran
• ⬇️ Popup descendue de 30px supplémentaires
• Décalage horizontal conservé : -40px
• Popup adaptative à la largeur disponible
• Aucun débordement horizontal volontaire
• Touch target confortable
• Image drapeau + FR / EN + flèche
• Popup : image + langue + code + état actif
• Light / Dark
• ThemeService conservé
• LanguageService conservé
• translate() conservé
• togglePopup() conservé
• selectLanguage() conservé
• Aucun changement TypeScript nécessaire

============================================================ -->


<!-- ============================================================
     🌐 LANGUAGE WRAPPER
============================================================= -->

<div
  class="
    language-wrapper
    relative
    inline-flex
    max-w-full
    shrink-0
  "
  (click)="$event.stopPropagation()"
>


  <!-- ==========================================================
       🌐 LANGUAGE BUTTON

       IMPORTANT :
       Le bouton reste exactement à sa position.
       Aucun décalage vertical n'est appliqué au bouton.
  =========================================================== -->

  <button
    type="button"
    [attr.aria-label]="translate('changeLanguage')"
    [title]="
      currentLanguage === 'fr'
        ? 'Langue'
        : 'Language'
    "
    [attr.aria-expanded]="isOpen"
    aria-haspopup="menu"
    class="
      language-button
      group
      relative
      flex
      h-11
      min-w-[92px]
      max-w-full
      shrink-0
      items-center
      justify-center
      gap-2
      rounded-full
      px-3.5
      cursor-pointer
      select-none
      overflow-hidden
      transition-all
      duration-200
      hover:scale-[1.025]
      active:scale-[0.97]
      focus:outline-none
      focus-visible:ring-2
      xl:h-11
      xl:min-w-[96px]
      xl:px-4
      2xl:h-12
      2xl:min-w-[100px]
      2xl:px-4
    "
    [ngStyle]="{
      'background': themeService.BG2,
      'border': '1px solid ' + themeService.BR2,
      'color': themeService.TX0,
      'box-shadow': '0 6px 18px ' + themeService.SHADOW
    }"
    (click)="togglePopup($event)"
  >


    <!-- ========================================================
         🌐 CURRENT LANGUAGE IMAGE
    ========================================================= -->

    <span
      class="
        language-flag
        flex
        h-7
        w-7
        shrink-0
        items-center
        justify-center
        overflow-hidden
        rounded-full
        transition-all
        duration-200
        group-hover:scale-110
        xl:h-7
        xl:w-7
        2xl:h-8
        2xl:w-8
      "
      [ngStyle]="{
        'background':
          isOpen
            ? themeService.BG3
            : themeService.BG4,
        'border':
          '1px solid ' + themeService.BR2
      }"
    >

      <img
        [src]="
          languageService.is('fr')
            ? 'assets/DrapeauFrance.png'
            : 'assets/DrapeauAnglais.jpg'
        "
        [alt]="
          languageService.is('fr')
            ? 'Français'
            : 'English'
        "
        class="
          h-full
          w-full
          rounded-full
          object-cover
          transition-transform
          duration-200
        "
      />

    </span>


    <!-- ========================================================
         🏷️ CURRENT LANGUAGE
    ========================================================= -->

    <span
      class="
        language-code
        min-w-0
        shrink
        text-[13px]
        font-bold
        uppercase
        tracking-[0.04em]
        xl:text-[13px]
        2xl:text-[14px]
      "
      [ngStyle]="{
        'color': themeService.TX0
      }"
    >
      {{ languageService.is('fr') ? 'FR' : 'EN' }}
    </span>


    <!-- ========================================================
         ⌄ ARROW
    ========================================================= -->

    <span
      class="
        flex
        h-5
        w-5
        shrink-0
        items-center
        justify-center
        transition-transform
        duration-200
      "
      [class.rotate-180]="isOpen"
      [ngStyle]="{
        'color':
          isOpen
            ? themeService.ICON
            : themeService.TX3
      }"
    >

      <i
        aria-hidden="true"
        class="
          fa-solid
          fa-chevron-down
          text-[10px]
          transition-colors
          duration-200
          xl:text-[10px]
          2xl:text-[11px]
        "
      ></i>

    </span>

  </button>


  <!-- ==========================================================
       🌐 POPUP ANCHOR

       • absolute
       • top-full = point d'ancrage sous le bouton
       • right-0 = alignement horizontal conservé
       • aucun déplacement du bouton
       • aucun calcul viewport

       ⬇️ DÉCALAGE VERTICAL +30PX

       ANCIEN :
         pt-2 = 8px

       NOUVEAU :
         pt-[38px] = 8px + 30px

       Résultat :
         la popup descend exactement de 30px
         par rapport à son ancien positionnement.

       IMPORTANT :
         le bouton ne bouge absolument pas.
  =========================================================== -->

  <div
    *ngIf="isOpen"
    class="
      absolute
      top-full
      right-0
      z-[99999]

      

      pt-[22px]
      -mr-48

      pointer-events-none
    "
  >


    <!-- ========================================================
         🌐 LANGUAGE POPUP

         • Sous le bouton
         • Décalage vertical : +30px
         • Décalage horizontal : -40px
         • Largeur contrôlée
         • Adaptative à l'écran
         • Pas de w-screen
         • Pas de position fixed
         • Pas de calcul viewport
    ========================================================= -->

    <div
      role="menu"
      [attr.aria-label]="translate('chooseLanguage')"
      class="
        language-popup
        pointer-events-auto
        relative
        z-[99999]
        flex
        w-[220px]
        max-w-[calc(100vw-16px)]
        min-w-0
        shrink-0
        flex-col
        overflow-hidden
        rounded-2xl
        p-1.5
        backdrop-blur-3xl
        backdrop-saturate-150
        origin-top-right
        animate-[languagePopupRightToLeft_160ms_ease-out]
        -translate-x-[40px]
      "
      [ngStyle]="{
        'background': themeService.BG2,
        'border': '1px solid ' + themeService.BR2,
        'box-shadow': '0 18px 45px ' + themeService.SHADOW,

        'transform': 'translateX(-40px) ' + popupTransform
      }"
      (click)="$event.stopPropagation()"
    >


      <!-- ======================================================
           🇫🇷 FRANÇAIS
      ======================================================= -->

      <button
        type="button"
        role="menuitem"
        class="
          language-option
          group
          flex
          min-w-0
          w-full
          items-center
          gap-3
          rounded-xl
          px-3
          py-2.5
          text-left
          cursor-pointer
          select-none
          transition-all
          duration-150
          hover:scale-[1.01]
          active:scale-[0.98]
          xl:py-3
        "
        [ngStyle]="{
          'background':
            languageService.is('fr')
              ? themeService.BG4
              : 'transparent',
          'border':
            languageService.is('fr')
              ? '1px solid ' + themeService.BR3
              : '1px solid transparent',
          'color':
            themeService.TX0
        }"
        (click)="selectLanguage('fr', $event)"
      >

        <!-- ==================================================
             🇫🇷 FLAG
        =================================================== -->

        <span
          class="
            flex
            h-9
            w-9
            shrink-0
            items-center
            justify-center
            overflow-hidden
            rounded-lg
            transition-all
            duration-150
            group-hover:scale-105
            xl:h-9
            xl:w-9
            2xl:h-10
            2xl:w-10
          "
          [ngStyle]="{
            'background':
              languageService.is('fr')
                ? themeService.BG3
                : themeService.BG4,
            'border':
              '1px solid ' + themeService.BR2
          }"
        >

          <img
            src="assets/DrapeauFrance.png"
            alt="Français"
            class="
              h-full
              w-full
              rounded-lg
              object-cover
            "
          />

        </span>


        <!-- ==================================================
             🏷️ LANGUAGE NAME
        =================================================== -->

        <span
          class="
            min-w-0
            flex-1
            truncate
            text-[13px]
            font-semibold
            tracking-[-0.01em]
            2xl:text-[14px]
          "
        >
          {{ translate('french') }}
        </span>


        <!-- ==================================================
             🇫🇷 CODE
        =================================================== -->

        <span
          class="
            shrink-0
            text-[10px]
            font-bold
            uppercase
            tracking-wider
          "
          [ngStyle]="{
            'color': themeService.TX3
          }"
        >
          FR
        </span>


        <!-- ==================================================
             ✅ ACTIVE
        =================================================== -->

        <span
          *ngIf="languageService.is('fr')"
          class="
            flex
            h-5
            w-5
            shrink-0
            items-center
            justify-center
            rounded-full
            2xl:h-6
            2xl:w-6
          "
          [ngStyle]="{
            'background': themeService.BUTON1BG,
            'color': themeService.BUTON1ICON
          }"
        >

          <i
            aria-hidden="true"
            class="fa-solid fa-check text-[9px]"
          ></i>

        </span>

      </button>


      <!-- ======================================================
           🇬🇧 ENGLISH
      ======================================================= -->

      <button
        type="button"
        role="menuitem"
        class="
          language-option
          group
          flex
          min-w-0
          w-full
          items-center
          gap-3
          rounded-xl
          px-3
          py-2.5
          text-left
          cursor-pointer
          select-none
          transition-all
          duration-150
          hover:scale-[1.01]
          active:scale-[0.98]
          xl:py-3
        "
        [ngStyle]="{
          'background':
            languageService.is('en')
              ? themeService.BG4
              : 'transparent',
          'border':
            languageService.is('en')
              ? '1px solid ' + themeService.BR3
              : '1px solid transparent',
          'color':
            themeService.TX0
        }"
        (click)="selectLanguage('en', $event)"
      >

        <!-- ==================================================
             🇬🇧 FLAG
        =================================================== -->

        <span
          class="
            flex
            h-9
            w-9
            shrink-0
            items-center
            justify-center
            overflow-hidden
            rounded-lg
            transition-all
            duration-150
            group-hover:scale-105
            xl:h-9
            xl:w-9
            2xl:h-10
            2xl:w-10
          "
          [ngStyle]="{
            'background':
              languageService.is('en')
                ? themeService.BG3
                : themeService.BG4,
            'border':
              '1px solid ' + themeService.BR2
          }"
        >

          <img
            src="assets/DrapeauAnglais.jpg"
            alt="English"
            class="
              h-full
              w-full
              rounded-lg
              object-cover
            "
          />

        </span>


        <!-- ==================================================
             🏷️ LANGUAGE NAME
        =================================================== -->

        <span
          class="
            min-w-0
            flex-1
            truncate
            text-[13px]
            font-semibold
            tracking-[-0.01em]
            2xl:text-[14px]
          "
        >
          {{ translate('english') }}
        </span>


        <!-- ==================================================
             🇬🇧 CODE
        =================================================== -->

        <span
          class="
            shrink-0
            text-[10px]
            font-bold
            uppercase
            tracking-wider
          "
          [ngStyle]="{
            'color': themeService.TX3
          }"
        >
          EN
        </span>


        <!-- ==================================================
             ✅ ACTIVE
        =================================================== -->

        <span
          *ngIf="languageService.is('en')"
          class="
            flex
            h-5
            w-5
            shrink-0
            items-center
            justify-center
            rounded-full
            2xl:h-6
            2xl:w-6
          "
          [ngStyle]="{
            'background': themeService.BUTON1BG,
            'color': themeService.BUTON1ICON
          }"
        >

          <i
            aria-hidden="true"
            class="fa-solid fa-check text-[9px]"
          ></i>

        </span>

      </button>


      <!-- ======================================================
           🌿 POPUP FOOTER SEPARATOR
      ======================================================= -->

      <div
        class="
          mx-2
          mt-1.5
          h-px
          shrink-0
        "
        [ngStyle]="{
          'background': themeService.BR2
        }"
      ></div>


      <!-- ======================================================
           🌿 POPUP FOOTER
      ======================================================= -->

      <div
        class="
          px-2
          pb-1
          pt-2.5
          text-center
        "
        [ngStyle]="{
          'color': themeService.TX3
        }"
      >

        <span
          class="
            block
            truncate
            text-[10px]
            tracking-wide
          "
        >
          Arboria
        </span>

      </div>

    </div>

  </div>

</div>


<!-- ============================================================
     💻 LAPTOP + DESKTOP UNIQUEMENT

     • À partir de 1240px
     • Le composant mobile/tablette est masqué
     • Ce composant prend le relais
============================================================= -->

<style>

  /* ------------------------------------------------------------
     💻 LAPTOP
     
     1240px → 1535px

     Le bouton reste positionné normalement.
     La popup reste ancrée dans le wrapper.
     ------------------------------------------------------------ */

  @media (min-width: 1240px) and (max-width: 1535px) {

    .language-wrapper {
      position: relative;
      display: inline-flex;
    }

    .language-button {
      position: relative;
    }

    .language-popup {
      width: 220px;
      max-width: calc(100vw - 16px);
    }

  }


  /* ------------------------------------------------------------
     🖥️ DESKTOP

     ≥ 1536px

     Même comportement que le laptop.
     Aucune modification de position verticale.
     ------------------------------------------------------------ */

  @media (min-width: 1536px) {

    .language-wrapper {
      position: relative;
      display: inline-flex;
    }

    .language-button {
      position: relative;
    }

    .language-popup {
      width: 220px;
      max-width: calc(100vw - 16px);
    }

  }


  /* ------------------------------------------------------------
     🚫 EN-DESSOUS DE 1240PX

     Cette version est réservée au laptop / desktop.
     Le composant mobile / tablette prend le relais.
     ------------------------------------------------------------ */

  @media (max-width: 1239px) {

    .language-wrapper {
      display: none;
    }

  }

</style>
