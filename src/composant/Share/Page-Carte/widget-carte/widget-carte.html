<!-- ============================================================
     🌿 JARDISCAN — PACKS DE CARTES

     • 4 packs neutres
     • Nombre de cartes dynamique selon MongoDB
     • 1–3 plantes  → 1 carte
     • 4–6 plantes  → 2 cartes
     • 7–10 plantes → 3 cartes
     • 11+ plantes  → 5 cartes
     • Une rareté est attribuée à chaque carte
     • Plantes récupérées depuis MongoDB
     • Packs affichés avec une image
     • Cartes retournables en 3D
     • Dos des cartes avec image
     • Aucun header
     • Aucun texte à côté
     • Aucun compteur
     • Aucun XP
     • Tailwind uniquement
     ============================================================ -->

     <section
     class="flex min-h-[100dvh] w-full items-center justify-center overflow-hidden px-4 py-8 transition-colors duration-300"
     style="
       background:
         radial-gradient(
           circle at 50% 20%,
           rgba(143, 175, 145, 0.12),
           transparent 38%
         ),
         var(--jardiscan-background, #f3f1e8);
     "
   >
     <!-- ==========================================================
          CHARGEMENT
          ========================================================== -->
   
     <div
       *ngIf="chargement"
       class="flex min-h-[280px] items-center justify-center"
     >
       <div
         class="flex h-20 w-20 animate-pulse items-center justify-center rounded-[26px] border border-[#d9dfd2] bg-white/80 text-[#1f5a4d] shadow-sm"
       >
         <i class="fa-solid fa-leaf text-2xl"></i>
       </div>
     </div>
   
     <!-- ==========================================================
          ERREUR
          ========================================================== -->
   
     <div
       *ngIf="!chargement && erreur"
       class="flex items-center justify-center"
     >
       <button
         type="button"
         (click)="chargerToutesLesPlantes()"
         class="group flex h-[180px] w-[150px] flex-col items-center justify-center rounded-[28px] border border-[#d9dfd2] bg-white text-[#133a3c] shadow-[0_18px_50px_rgba(19,58,60,0.08)] transition-all duration-300 hover:-translate-y-2 hover:shadow-[0_25px_60px_rgba(19,58,60,0.14)]"
       >
         <div
           class="mb-4 flex h-14 w-14 items-center justify-center rounded-2xl bg-[#e4eee7] text-[#1f5a4d]"
         >
           <i
             class="fa-solid fa-rotate-right text-lg transition-transform duration-500 group-hover:rotate-180"
           ></i>
         </div>
   
         <span
           class="text-[10px] font-black uppercase tracking-[0.15em]"
         >
           Réessayer
         </span>
       </button>
     </div>
   
     <!-- ==========================================================
          4 PACKS
          ========================================================== -->
   
     <div
       *ngIf="
         !chargement &&
         !erreur &&
         !packOuvert &&
         toutesLesPlantes.length > 0
       "
       class="flex w-full max-w-[1280px] items-center justify-center"
     >
       <div
         class="grid w-full grid-cols-4 items-center justify-center gap-5 max-[1050px]:grid-cols-2 max-[600px]:grid-cols-1"
       >
   
         <!-- ======================================================
              PACK 1
              ====================================================== -->
   
         <button
           type="button"
           (click)="ouvrirPack()"
           aria-label="Ouvrir le pack 1"
           class="group relative mx-auto aspect-[0.70] w-full max-w-[250px] overflow-hidden rounded-[32px] transition-all duration-500 hover:-translate-y-4 active:scale-[0.96]"
         >
           <img
             src="assets/PackCarte.png"
             alt="Pack de cartes JardiScan"
             class="h-full w-full object-contain drop-shadow-[0_25px_35px_rgba(19,58,60,0.20)] transition-transform duration-500 group-hover:scale-[1.05] group-hover:rotate-[-2deg]"
           />
   
           <div
             class="pointer-events-none absolute inset-0 rounded-[32px] bg-white/0 transition-all duration-500 group-hover:bg-white/[0.04]"
           ></div>
         </button>
   
         <!-- ======================================================
              PACK 2
              ====================================================== -->
   
         <button
           type="button"
           (click)="ouvrirPack()"
           aria-label="Ouvrir le pack 2"
           class="group relative mx-auto aspect-[0.70] w-full max-w-[250px] overflow-hidden rounded-[32px] transition-all duration-500 hover:-translate-y-4 active:scale-[0.96]"
         >
           <img
             src="assets/PackCarte.png"
             alt="Pack de cartes JardiScan"
             class="h-full w-full object-contain drop-shadow-[0_25px_35px_rgba(19,58,60,0.20)] transition-transform duration-500 group-hover:scale-[1.05] group-hover:rotate-[2deg]"
           />
   
           <div
             class="pointer-events-none absolute inset-0 rounded-[32px] bg-white/0 transition-all duration-500 group-hover:bg-white/[0.04]"
           ></div>
         </button>
   
         <!-- ======================================================
              PACK 3
              ====================================================== -->
   
         <button
           type="button"
           (click)="ouvrirPack()"
           aria-label="Ouvrir le pack 3"
           class="group relative mx-auto aspect-[0.70] w-full max-w-[250px] overflow-hidden rounded-[32px] transition-all duration-500 hover:-translate-y-4 active:scale-[0.96]"
         >
           <img
             src="assets/PackCarte.png"
             alt="Pack de cartes JardiScan"
             class="h-full w-full object-contain drop-shadow-[0_25px_35px_rgba(19,58,60,0.20)] transition-transform duration-500 group-hover:scale-[1.05] group-hover:rotate-[-2deg]"
           />
   
           <div
             class="pointer-events-none absolute inset-0 rounded-[32px] bg-white/0 transition-all duration-500 group-hover:bg-white/[0.04]"
           ></div>
         </button>
   
         <!-- ======================================================
              PACK 4
              ====================================================== -->
   
         <button
           type="button"
           (click)="ouvrirPack()"
           aria-label="Ouvrir le pack 4"
           class="group relative mx-auto aspect-[0.70] w-full max-w-[250px] overflow-hidden rounded-[32px] transition-all duration-500 hover:-translate-y-4 active:scale-[0.96]"
         >
           <img
             src="assets/PackCarte.png"
             alt="Pack de cartes JardiScan"
             class="h-full w-full object-contain drop-shadow-[0_25px_35px_rgba(19,58,60,0.20)] transition-transform duration-500 group-hover:scale-[1.05] group-hover:rotate-[2deg]"
           />
   
           <div
             class="pointer-events-none absolute inset-0 rounded-[32px] bg-white/0 transition-all duration-500 group-hover:bg-white/[0.04]"
           ></div>
         </button>
   
       </div>
     </div>
   
     <!-- ==========================================================
          AUCUNE PLANTE
          ========================================================== -->
   
     <div
       *ngIf="
         !chargement &&
         !erreur &&
         toutesLesPlantes.length === 0
       "
       class="flex items-center justify-center"
     >
       <button
         type="button"
         (click)="chargerToutesLesPlantes()"
         class="group flex h-[180px] w-[150px] flex-col items-center justify-center rounded-[28px] border border-[#d9dfd2] bg-white text-[#133a3c] shadow-[0_18px_50px_rgba(19,58,60,0.08)] transition-all duration-300 hover:-translate-y-2"
       >
         <div
           class="mb-4 flex h-14 w-14 items-center justify-center rounded-2xl bg-[#e4eee7] text-[#1f5a4d]"
         >
           <i class="fa-solid fa-leaf text-lg"></i>
         </div>
   
         <span
           class="text-[10px] font-black uppercase tracking-[0.12em]"
         >
           Aucun pack
         </span>
       </button>
     </div>
   
     <!-- ==========================================================
          OUVERTURE / CARTES
          ========================================================== -->
   
     <div
       *ngIf="packOuvert"
       class="fixed inset-0 z-50 flex min-h-[100dvh] items-center justify-center overflow-y-auto bg-[#133a3c]/80 px-4 py-8 backdrop-blur-md"
     >
   
       <!-- ========================================================
            ANIMATION D'OUVERTURE
            ======================================================== -->
   
       <div
         *ngIf="revelationEnCours"
         class="relative flex min-h-[360px] w-full max-w-[420px] flex-col items-center justify-center overflow-hidden rounded-[36px] border border-white/10 bg-[#173f3e] shadow-[0_35px_100px_rgba(0,0,0,0.35)]"
       >
   
         <div
           class="absolute h-[330px] w-[330px] animate-spin rounded-full bg-[conic-gradient(from_0deg,transparent,rgba(143,175,145,0.35),transparent,rgba(255,255,255,0.18),transparent)] blur-sm"
         ></div>
   
         <!-- IMAGE DU PACK -->
   
         <div
           class="relative flex aspect-[0.70] w-[145px] animate-pulse items-center justify-center"
         >
           <img
             src="assets/PackCarte.png"
             alt="Ouverture du pack JardiScan"
             class="h-full w-full object-contain drop-shadow-[0_30px_70px_rgba(0,0,0,0.40)]"
           />
         </div>
   
         <div
           class="relative mt-7 flex items-center gap-2 text-[10px] font-black uppercase tracking-[0.2em] text-white/70"
         >
           Ouverture
   
           <span class="flex gap-1">
             <span
               class="h-1 w-1 animate-bounce rounded-full bg-white"
             ></span>
   
             <span
               class="h-1 w-1 animate-bounce rounded-full bg-white [animation-delay:150ms]"
             ></span>
   
             <span
               class="h-1 w-1 animate-bounce rounded-full bg-white [animation-delay:300ms]"
             ></span>
           </span>
         </div>
       </div>
   
       <!-- ========================================================
            CARTES RÉVÉLÉES
            ======================================================== -->
   
       <div
         *ngIf="cartesRevelees && !revelationEnCours"
         class="w-full max-w-[1100px]"
       >
   
         <!-- ======================================================
              GRILLE
              ====================================================== -->
   
         <div
           class="grid grid-cols-5 gap-5 max-[900px]:grid-cols-3 max-[600px]:grid-cols-2"
         >
   
           <!-- ====================================================
                CARTE
                ==================================================== -->
   
           <button
             *ngFor="
               let carte of cartesDuPack;
               let i = index
             "
             type="button"
             (click)="tournerCarte(i)"
             [attr.aria-label]="
               cartesRetournees[i]
                 ? 'Voir le recto de la carte'
                 : 'Voir le verso de la carte'
             "
             class="group relative aspect-[0.68] w-full [perspective:1200px]"
           >
   
             <!-- ==================================================
                  CONTENEUR 3D
                  ================================================== -->
   
             <div
               class="relative h-full w-full transition-transform duration-700 [transform-style:preserve-3d]"
               [ngClass]="{
                 '[transform:rotateY(180deg)]': cartesRetournees[i]
               }"
             >
   
               <!-- ==================================================
                    RECTO
                    ================================================== -->
   
               <div
                 class="absolute inset-0 h-full w-full overflow-hidden rounded-[24px] border-2 p-[2px] text-left shadow-[0_20px_50px_rgba(0,0,0,0.20)] [backface-visibility:hidden]"
                 [ngClass]="{
                   'border-[#8aa77f] bg-gradient-to-br from-[#789b72] to-[#4f8061]':
                     carte.rarete === 'commune',
   
                   'border-[#6d9bc0] bg-gradient-to-br from-[#6f9fc4] to-[#345b7b]':
                     carte.rarete === 'rare',
   
                   'border-[#a38acb] bg-gradient-to-br from-[#9875c2] to-[#60428a]':
                     carte.rarete === 'epique',
   
                   'border-[#e0ad54] bg-gradient-to-br from-[#d4a044] to-[#80591e]':
                     carte.rarete === 'legendaire'
                 }"
               >
   
                 <div
                   class="relative flex h-full w-full flex-col overflow-hidden rounded-[20px] bg-[#f3f1e8]"
                 >
   
                   <!-- RARETÉ -->
   
                   <div
                     class="absolute left-3 top-3 z-10 rounded-full bg-white/90 px-2.5 py-1 text-[7px] font-black uppercase tracking-[0.12em] text-[#133a3c] shadow-sm"
                   >
                     {{ getNomRarete(carte.rarete) }}
                   </div>
   
                   <!-- IMAGE -->
   
                   <div
                     class="relative flex min-h-0 flex-1 items-center justify-center overflow-hidden bg-[#e4eee7]"
                   >
   
                     <img
                       *ngIf="carte.image"
                       [src]="carte.image"
                       [alt]="carte.nom"
                       class="h-full w-full object-cover transition-transform duration-500 group-hover:scale-105"
                       loading="lazy"
                     />
   
                     <div
                       *ngIf="!carte.image"
                       class="flex h-full w-full items-center justify-center bg-gradient-to-br from-[#e4eee7] to-[#cbd9cf]"
                     >
                       <i
                         class="fa-solid fa-leaf text-4xl text-[#4f8061]"
                       ></i>
                     </div>
   
                     <!-- EFFET LÉGENDAIRE -->
   
                     <div
                       *ngIf="carte.rarete === 'legendaire'"
                       class="pointer-events-none absolute inset-0 bg-[radial-gradient(circle_at_50%_20%,rgba(255,255,255,0.45),transparent_38%)]"
                     ></div>
   
                   </div>
   
                   <!-- NOM -->
   
                   <div
                     class="bg-white px-3 py-3"
                   >
                     <strong
                       class="block truncate text-[11px] font-black text-[#133a3c]"
                     >
                       {{ carte.nom }}
                     </strong>
   
                     <span
                       class="mt-1 block truncate text-[8px] italic text-[#718178]"
                     >
                       {{ carte.espece }}
                     </span>
                   </div>
   
                 </div>
               </div>
   
               <!-- ==================================================
                    DOS DE LA CARTE
                    ================================================== -->
   
               <div
                 class="absolute inset-0 h-full w-full overflow-hidden rounded-[24px] [backface-visibility:hidden] [transform:rotateY(180deg)]"
               >
   
                 <div
                   class="relative h-full w-full overflow-hidden rounded-[22px] bg-[#173f3e] shadow-[0_20px_50px_rgba(0,0,0,0.30)]"
                 >
   
                   <img
                     src="assets/DosCarte.png"
                     alt="Dos de la carte JardiScan"
                     class="h-full w-full object-cover"
                   />
   
                   <!-- LÉGER EFFET DE LUMIÈRE -->
   
                   <div
                     class="pointer-events-none absolute inset-0 bg-[radial-gradient(circle_at_50%_20%,rgba(255,255,255,0.16),transparent_42%)]"
                   ></div>
   
                   <!-- REFLET -->
   
                   <div
                     class="pointer-events-none absolute -left-1/2 top-0 h-full w-1/3 rotate-[18deg] bg-white/10 blur-xl transition-all duration-700 group-hover:left-[120%]"
                   ></div>
   
                 </div>
               </div>
   
             </div>
           </button>
   
         </div>
   
         <!-- ======================================================
              INDICATION
              ====================================================== -->
   
         <div
           class="mt-6 flex justify-center"
         >
           <div
             class="flex items-center gap-2 rounded-full border border-white/15 bg-white/10 px-5 py-2.5 text-[9px] font-black uppercase tracking-[0.14em] text-white/70 backdrop-blur-md"
           >
             <i class="fa-solid fa-rotate text-[10px]"></i>
             Cliquez sur une carte pour la retourner
           </div>
         </div>
   
         <!-- ======================================================
              FERMER
              ====================================================== -->
   
         <div
           class="mt-4 flex justify-center"
         >
           <button
             type="button"
             (click)="fermerPack()"
             class="flex h-11 items-center justify-center rounded-full border border-white/20 bg-white/10 px-6 text-[9px] font-black uppercase tracking-[0.15em] text-white backdrop-blur-md transition-all hover:bg-white/20"
           >
             <i class="fa-solid fa-xmark mr-2"></i>
             Fermer
           </button>
         </div>
   
       </div>
   
     </div>
   
   </section>
